---
# Record the reported settings after a successful apply.

- name: Add 'munin' variable values to {{ iiab_ini_file }}
  ini_file:
    path: "{{ iiab_ini_file }}"    # /etc/iiab/iiab.ini
    section: munin
    option: "{{ item.option }}"
    value: "{{ item.value | string }}"
  with_items:
    - option: name
      value: Munin
    - option: description
      value: '"Munin is a networked resource monitoring tool that can help analyze resource trends and ''what just happened to kill our performance?'' problems."'
    - option: munin_install
      value: "{{ munin_install }}"
    - option: munin_enabled
      value: "{{ munin_enabled }}"

- name: "Add 'munin_installed: True' to {{ iiab_state_file }}"
  iiab_state:
    key: munin_installed
