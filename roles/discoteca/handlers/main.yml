---
# The systemd and pdsm (proot) variants listen to the same topic, so configure.yml
# notifies one name and only the applicable task runs.

- name: Restart discoteca via systemd
  systemd:
    name: "{{ discoteca_service }}"
    state: restarted
    daemon_reload: true
  when:
    - discoteca_enabled | bool
    - not is_proot
  listen: Restart discoteca

- name: Restart discoteca via pdsm
  command: pdsm restart discoteca
  when:
    - discoteca_enabled | bool
    - is_proot
  listen: Restart discoteca
