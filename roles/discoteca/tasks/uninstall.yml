---
# The runner includes this file for --uninstall and for the remove half of
# --reinstall. Everything here is local; --uninstall must work without a
# network.
#
# Remove the program, its program data, and its settings. The databases in
# {{ discoteca_database_dir }} are never deleted; media may live anywhere and
# is never touched.

- name: Stop and disable the discoteca service (not proot)
  systemd:
    name: "{{ discoteca_service }}"
    enabled: false
    state: stopped
  when: not is_proot
  failed_when: false

- name: Stop the discoteca service via pdsm (proot)
  command: pdsm stop discoteca
  when: is_proot
  failed_when: false

- name: Disable the discoteca service via pdsm (proot)
  command: pdsm disable discoteca
  when: is_proot
  failed_when: false

- name: Remove discoteca program data and user settings
  file:
    path: "{{ item }}"
    state: absent
  loop: "{{ discoteca_program_data }}"
  loop_control:
    label: "{{ item }}"
  notify:
    - Reload nginx

- name: Reload systemd after removing the discoteca unit (not proot)
  systemd:
    daemon_reload: true
  when: not is_proot

- name: Remove the versioned discoteca binaries and the stable symlink
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ discoteca_install_dir }}"
    - "{{ discoteca_bin }}"

- name: Record that discoteca is uninstalled in {{ iiab_ini_file }}
  ini_file:
    path: "{{ iiab_ini_file }}"
    section: discoteca
    option: discoteca_install
    value: "False"

- name: Record that discoteca is disabled in {{ iiab_ini_file }}
  ini_file:
    path: "{{ iiab_ini_file }}"
    section: discoteca
    option: discoteca_enabled
    value: "False"

- name: Remove discoteca markers from {{ iiab_state_file }}
  iiab_state:
    key: discoteca_installed
    state: absent
