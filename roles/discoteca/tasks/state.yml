---
# Record the role's settings and installed marker after a successful apply.

- name: Add 'discoteca' variable values to {{ iiab_ini_file }}
  ini_file:
    path: "{{ iiab_ini_file }}"    # /etc/iiab/iiab.ini
    section: discoteca
    option: "{{ item.option }}"
    value: "{{ item.value | string }}"
  with_items:
    - option: name
      value: discoteca
    - option: description
      value: '"discoteca is a local media library and streaming server for offline video, audio, and books."'
    - option: discoteca_install
      value: "{{ discoteca_install }}"
    - option: discoteca_enabled
      value: "{{ discoteca_enabled }}"
    - option: discoteca_url
      value: "{{ discoteca_url }}"
    - option: discoteca_port
      value: "{{ discoteca_port }}"
    - option: discoteca_database_dir
      value: "{{ discoteca_database_dir }}"
    - option: discoteca_databases
      value: "{{ discoteca_databases | join(',') }}"

- name: "Add 'discoteca_installed: True' to {{ iiab_state_file }}"
  iiab_state:
    key: discoteca_installed
