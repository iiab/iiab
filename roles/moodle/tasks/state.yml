---
# Record the reported settings after a successful apply.

- name: Add 'moodle' variable values to {{ iiab_ini_file }}
  ini_file:
    path: "{{ iiab_ini_file }}"    # /etc/iiab/iiab.ini
    section: moodle
    option: "{{ item.option }}"
    value: "{{ item.value | string }}"
  with_items:
    - option: name
      value: Moodle
    - option: description
      value: '"Access the Moodle learning management system."'
    - option: moodle_install
      value: "{{ moodle_install }}"
    - option: moodle_enabled
      value: "{{ moodle_enabled }}"
    - option: moodle_base
      value: "{{ moodle_base }}"

- name: "Add 'moodle_installed: True' to {{ iiab_state_file }}"
  iiab_state:
    key: moodle_installed
