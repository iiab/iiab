---
# Record the reported settings after a successful apply.

- name: Add 'monit' variable values to {{ iiab_ini_file }}
  ini_file:
    path: "{{ iiab_ini_file }}"    # /etc/iiab/iiab.ini
    section: monit
    option: "{{ item.option }}"
    value: "{{ item.value | string }}"
  with_items:
    - option: name
      value: Monit
    - option: description
      value: '"Monit is a background service monitor which can correct problems, send email, restart services."'
    - option: enabled
      value: "{{ monit_enabled }}"

- name: "Add 'monit_installed: True' to {{ iiab_state_file }}"
  iiab_state:
    key: monit_installed
