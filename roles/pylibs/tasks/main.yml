- name: Decide whether to record pylibs disk usage
  set_fact:
    pylibs_record_disk_usage: "{{ not lookup('installed', 'pylibs_installed') }}"

- name: Record initial disk space used for pylibs
  include_role:
    name: 0-init
    tasks_from: disk_usage_start
  when: pylibs_record_disk_usage | bool


- name: Install iiab lib files
  template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  with_items:
    - { src: 'iiab_const.py.j2', dest: '{{ py3_dist_path }}/iiab/iiab_const.py' }
    - { src: 'iiab_lib.py', dest: '{{ py3_dist_path }}/iiab/iiab_lib.py' }
    - { src: 'iiab_env.py.j2', dest: '{{ iiab_etc_path }}/iiab_env.py' }


# RECORD pylibs AS INSTALLED

- name: Record final disk space used for pylibs
  include_role:
    name: 0-init
    tasks_from: disk_usage_finish
  when: pylibs_record_disk_usage | bool


- name: "Add 'pylibs_installed: True' to {{ iiab_state_file }}"
  iiab_state:
    key: pylibs_installed
