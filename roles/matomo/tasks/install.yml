---
# Install/update phase. The runner runs this on first install, --reinstall
# and --clean-install. install.yml is the only phase
# that installs packages or downloads Matomo. The download is skipped when the
# archive is already present, and extraction is skipped once Matomo is in
# place, so a plain apply does not re-download anything.

- name: "Set 'mysql_install: True' and 'mysql_enabled: True'"
  set_fact:
    mysql_install: True
    mysql_enabled: True

- name: MYSQL - run 'mysql' role (attempt to install & enable MySQL / MariaDB)
  include_role:
    name: mysql

- name: FAIL (STOP THE INSTALL) IF 'mysql_installed is undefined'
  fail:
    msg: "Matomo install cannot proceed, as MySQL / MariaDB is not installed."
  when: not lookup('installed', 'mysql_installed')

# https://matomo.org/faq/on-premise/matomo-requirements/
- name: Install Matomo's recommended PHP extensions
  package:
    name:
      - php{{ php_version }}-curl
      - php{{ php_version }}-gd
      - php{{ php_version }}-cli
      - php{{ php_version }}-mysql
      - php{{ php_version }}-xml
      - php{{ php_version }}-mbstring

- name: "Run roles/www_options/tasks/php-settings.yml with 'nginx_high_php_limits: False' by default"
  include_tasks: roles/www_options/tasks/php-settings.yml
  when: php_settings_done is undefined

- name: Download Matomo (2 min)
  get_curl:
    url: "{{ matomo_dl_url }}"    # e.g. https://builds.matomo.org/matomo.tar.gz
    dest: "{{ downloads_dir }}/matomo.tar.gz"
    timeout: "{{ download_timeout }}"
  register: matomo_dl

- name: Extract Matomo (1 min)
  unarchive:
    src: "{{ matomo_dl.dest }}"
    dest: "{{ matomo_path }}"     # e.g. /library/www
    creates: "{{ matomo_path }}/matomo/index.php"

- name: Set Matomo Directory Permissions
  file:
    path: "{{ matomo_path }}/matomo"
    recurse: yes
    owner: "{{ apache_user }}"    # e.g. www-data
    group: "{{ apache_user }}"
- name: Start 'php-fpm' via pdsm (proot)
  command: pdsm start php-fpm
  register: pdsm_start
  changed_when: "'already running' not in pdsm_start.stdout"
  when: is_proot

- name: Start MariaDB
  # action: service name=mysql state=started
  systemd:
    name: "{{ mysql_service }}"
    state: started
  when: not is_proot

- name: Start 'mariadb' via pdsm (proot)
  command: pdsm start mariadb
  register: pdsm_start
  changed_when: "'already running' not in pdsm_start.stdout"
  when: is_proot

- name: Create MariaDB Database for Matomo
  ansible.mariadb.mariadb_db:
    name: "{{ matomo_db_name }}"
    # login_unix_socket: /var/run/mysqld/mysqld.sock
  when: not is_proot

- name: Add Admin User to MariaDB Database
  ansible.mariadb.mariadb_user:
    name: "{{ matomo_db_user }}"
    password: "{{ matomo_db_pass }}"
    update_password: on_create    # OR SHOULD './runrole --reinstall matomo' FORCE A COMPLETELY CLEAN INSTALL?
    priv: "{{ matomo_db_name }}.*:ALL"
    # login_unix_socket: /var/run/mysqld/mysqld.sock
  when: not is_proot

- name: Prepare MariaDB database and user on (proot)
  when: is_proot
  block:
    - name: Create MariaDB Database for Matomo (proot)
      ansible.mariadb.mariadb_db:
        name: "{{ matomo_db_name }}"
        state: present
        encoding: utf8mb4
        collation: utf8mb4_general_ci
        login_unix_socket: "{{ mariadb_run_dir }}/mysqld.sock"
        check_implicit_admin: true

    - name: Ensure Matomo DB user exists for localhost and 127.0.0.1 (proot)
      ansible.mariadb.mariadb_user:
        name: "{{ matomo_db_user }}"
        host: "{{ item }}"
        password: "{{ matomo_db_pass }}"
        update_password: on_create
        priv: "{{ matomo_db_name }}.*:ALL"
        plugin: mysql_native_password
        login_unix_socket: "{{ mariadb_run_dir }}/mysqld.sock"
        check_implicit_admin: true
      loop:
        - localhost
        - "{{ tcp_host }}"

# The installed marker is written at the end of configure.yml, once the
# one-time Matomo web installer has completed. A failure there must retry the
# whole setup on the next run rather than leave Matomo half-configured.
