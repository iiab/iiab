---
# Reconciles Matomo configuration on every apply. The NGINX shortcut is applied
# first so the one-time web installer can reach the site; everything else is
# local configuration.

- name: Enable http://box/matomo via NGINX, by installing {{ nginx_conf_dir }}/matomo-nginx.conf from template
  template:
    src: matomo-nginx.conf.j2
    dest: "{{ nginx_conf_dir }}/matomo-nginx.conf"    # /etc/nginx/conf.d
  notify:
    - Reload nginx
  when: matomo_enabled

- name: Disable http://box/matomo via NGINX, by removing {{ nginx_conf_dir }}/matomo-nginx.conf
  file:
    path: "{{ nginx_conf_dir }}/matomo-nginx.conf"    # /etc/nginx/conf.d
    state: absent
  notify:
    - Reload nginx
  when: not matomo_enabled

- name: Apply the NGINX shortcut before running the Matomo web installer
  meta: flush_handlers

# The sections of code interacting with the Matomo website are modified from code found at https://git.coop/webarch/matomo/. This code is distributed under
# Version 3 of the GNU General Public License. We modified this code and applied it here in April 2022. The derived sections correspond to the tasks running
# from "HTTP Get Welcome" through "Finish Matomo Setup", lines 63 through 199.
#
# These requests go to the local Matomo site, not to the Internet. They run
# only on the first apply because the installer is not idempotent, and
# 0-init/tasks/lifecycle.yml captured lifecycle_needs_setup before install.yml
# wrote the marker.
- name: Complete the Matomo web installer
  when: lifecycle_needs_setup | bool
  block:

    - name: HTTP Get Welcome
      uri:
        url: "{{ matomo_full_url }}index.php?action=welcome"    # e.g. http://box.lan/matomo
        method: GET
        status_code: 200
        timeout: 120
      register: matomo_welcome
      until: matomo_welcome.status == 200
      retries: 3
      delay: 5

    - name: Show Matomo Welcome page HTTP status
      debug:
        msg: "Matomo welcome page returned HTTP {{ matomo_welcome.status }} for {{ matomo_welcome.url }} (after {{ matomo_welcome.attempts }} attempt{{ 's' if matomo_welcome.attempts != 1 else '' }})"

    - name: Set a variable for the MATOMO_SESSID cookie
      set_fact:
        matomo_session_cookie: "MATOMO_SESSID={{ cookie.value }}"
      when: cookie.key == "MATOMO_SESSID"
      loop: "{{ matomo_welcome.cookies | dict2items }}"
      loop_control:
        loop_var: cookie

    - name: Get Matomo System Check
      uri:
        url: "{{ matomo_full_url }}index.php?action=systemCheck"
        method: GET
        headers:
          Cookie: "{{ matomo_session_cookie }}"
        return_content: true
        timeout: 120
        status_code: 200
      register: matomo_system_check
      until: matomo_system_check.status == 200
      retries: 3
      delay: 5

    - name: Matomo Database Setup
      uri:
        url: "{{ matomo_full_url }}index.php?action=databaseSetup"
        method: POST
        headers:
          Cookie: "{{ matomo_session_cookie }}"
        body:
          # TCP fields only in proot:
          host: "{{ tcp_host if is_proot else omit }}"
          port: "{{ tcp_port if is_proot else omit }}"
          unix_socket: "{{ '' if is_proot else omit }}"
          charset: "{{ 'utf8mb4' if is_proot else omit }}"
          type: "{{ 'InnoDB' if is_proot else omit }}"
          # Common fields:
          username: "{{ matomo_db_user }}"
          password: "{{ matomo_db_pass }}"
          dbname: "{{ matomo_db_name }}"
          tables_prefix: "matomo_"
          adapter: "PDO\\MYSQL"
        body_format: form-urlencoded
        status_code: [200, 302]
        follow_redirects: all
        timeout: 120
      register: matomo_database_setup
      until: matomo_database_setup.status in [200, 302]
      retries: 3
      delay: 5

    - name: Matomo Table Creation
      uri:
        url: "{{ matomo_full_url }}index.php?action=tablesCreation&module=Installation"
        method: GET
        headers:
          Cookie: "{{ matomo_session_cookie }}"
        status_code: [200, 302]
        follow_redirects: all
        return_content: true
      register: matomo_table_creation
      failed_when: false
      retries: 3
      delay: 5
      until: matomo_table_creation.status in [200, 302]

    - name: Set a variable for the MATOMO_SESSID cookie
      set_fact:
        matomo_session_cookie: "MATOMO_SESSID={{ cookie.value }}"
      when:
        - matomo_table_creation.cookies is defined
        - matomo_table_creation.cookies | length > 0
        - cookie.key == "MATOMO_SESSID"
      loop: "{{ matomo_table_creation.cookies | dict2items }}"
      loop_control:
        loop_var: cookie

    - name: Matomo User Setup
      uri:
        url: "{{ matomo_full_url }}index.php?action=setupSuperUser&module=Installation"
        method: POST
        headers:
          Cookie: "{{ matomo_session_cookie }}"
        body:
          login: "{{ matomo_db_user }}"
          password: "{{ matomo_db_pass }}"
          password_bis: "{{ matomo_db_pass }}"
          email: "nobody@dev.null"
          subscribe_newsletter_piwikorg: 0
          subscribe_newsletter_professionalservices: 0
        body_format: form-urlencoded
        status_code: 302
        timeout: 120
      register: matomo_setup_superuser
      until: matomo_setup_superuser.status == 302
      retries: 3
      delay: 5

    - name: Configure Matomo to track IIAB
      uri:
        url: "{{ matomo_full_url }}index.php?action=firstWebsiteSetup&module=Installation"
        method: POST
        headers:
          Cookie: "{{ matomo_session_cookie }}"
        body:
          siteName: "IIAB"
          url: "{{ matomo_host_url }}"
          ecommerce: 0
        body_format: form-urlencoded
        status_code: [200, 302]
        timeout: 120
      register: _result
      until: _result.status in [200, 302]
      retries: 3
      delay: 5

    - name: Fallback Configure Matomo to track IIAB
      uri:
        url: "{{ matomo_full_url }}index.php?action=firstWebsiteSetup&module=Installation"
        method: POST
        headers:
          Cookie: "{{ matomo_session_cookie }}"
        body:
          siteName: "IIAB"
          url: "{{ matomo_host_url }}"
          timezone: "Europe/London"
          ecommerce: 0
        body_format: form-urlencoded
        status_code: 302
        timeout: 120
      register: _fallback_result
      until: _fallback_result.status == 302
      retries: 3
      delay: 5
      when: _result.status == 200

    - name: Matomo Tracking Code
      uri:
        url: "{{ matomo_full_url }}index.php?action=trackingCode&module=Installation&site_idSite=1&site_name={{ matomo_host_url }}"
        method: GET
        headers:
          Cookie: "{{ matomo_session_cookie }}"
        return_content: true
        status_code: 200
        timeout: 120
      register: matomo_tracking_code
      until: matomo_tracking_code.status == 200
      retries: 3
      delay: 5

    - name: Finish Matomo Setup
      uri:
        url: "{{ matomo_full_url }}index.php?action=finished&module=Installation"
        method: POST
        headers:
          Cookie: "{{ matomo_session_cookie }}"
        body:
          do_not_track: 1
          anonymise_ip: 1
          submit: "Continue to Matomo"
        body_format: form-urlencoded
        status_code: 302
        timeout: 120
      register: matomo_finished
      until: matomo_finished.status == 302
      retries: 3
      delay: 5

- name: Start Collecting Matomo Data
  cron:
    name: "MatomoDataIngestionOnReboot"
    special_time: reboot
    job: "{{ matomo_cronjob }}"
    user: root
    cron_file: "matomo_reboot"

- name: Run Daily Job Collecting Matomo Data
  cron:
    name: "DailyMatomoDataIngestion"
    minute: "0"
    hour: "0"
    job: "{{ matomo_cronjob }}"
    user: root
    cron_file: "matomo_daily"

- name: Set Permissions for token.php
  copy:
    content: ""
    dest: "{{ matomo_path }}/matomo/tmp/cache/token.php"
    group: "{{ apache_user }}"
    owner: "{{ apache_user }}"

- name: Set Permissions for tracker Directory
  file:
    path: "{{ matomo_path }}/matomo/tmp/cache/tracker"
    state: directory
    owner: "{{ apache_user }}"
    group: "{{ apache_user }}"

- name: Don't Check for Trusted Host
  ini_file:
    path: "{{ matomo_path }}/matomo/config/config.ini.php"
    section: General
    option: enable_trusted_host_check
    value: 0
