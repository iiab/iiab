---
# Record the reported settings after a successful apply.

- name: Add 'wordpress' variable values to {{ iiab_ini_file }}
  ini_file:
    path: "{{ iiab_ini_file }}"    # /etc/iiab/iiab.ini
    section: wordpress
    option: "{{ item.option }}"
    value: "{{ item.value | string }}"
  with_items:
    - option: name
      value: WordPress
    - option: description
      value: '"WordPress is a blog and web site management application."'
    - option: wordpress_install
      value: "{{ wordpress_install }}"
    - option: wordpress_enabled
      value: "{{ wordpress_enabled }}"
    - option: wordpress_src
      value: "{{ wordpress_src }}"
    - option: wp_abs_path
      value: "{{ wp_abs_path }}"
    - option: wp_db_name
      value: "{{ wp_db_name }}"
    - option: wp_db_user
      value: "{{ wp_db_user }}"
    - option: wp_url
      value: "{{ wp_url }}"
    - option: wp_full_url
      value: "{{ wp_full_url }}"

- name: "Add 'wordpress_installed: True' to {{ iiab_state_file }}"
  iiab_state:
    key: wordpress_installed
