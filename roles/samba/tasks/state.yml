---
# Record the reported settings after a successful apply.

- name: Add 'samba' variable values to {{ iiab_ini_file }}
  ini_file:
    path: "{{ iiab_ini_file }}"    # /etc/iiab/iiab.ini
    section: samba
    option: "{{ item.option }}"
    value: "{{ item.value | string }}"
  with_items:
    - option: name
      value: Samba
    - option: description
      value: '"Samba is a Microsoft-compatible network file system that re-implements SMB/CIFS (Common Internet File System)."'
    - option: samba_install
      value: "{{ samba_install }}"
    - option: samba_enabled
      value: "{{ samba_enabled }}"

- name: "Add 'samba_installed: True' to {{ iiab_state_file }}"
  iiab_state:
    key: samba_installed
