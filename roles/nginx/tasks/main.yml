# "How do i fail a task in Ansible if the variable contains a boolean value?
# I want to perform input validation for Ansible playbooks"
# https://stackoverflow.com/questions/46664127/how-do-i-fail-a-task-in-ansible-if-the-variable-contains-a-boolean-value-i-want/46667499#46667499

# We assume 0-init/tasks/validate_vars.yml has DEFINITELY been run, so no need
# to re-check whether vars are defined here.  As Ansible vars cannot be unset:
# https://serverfault.com/questions/856729/how-to-destroy-delete-unset-a-variable-value-in-ansible

- name: Assert that "nginx_install is sameas true" (boolean not string etc)
  assert:
    that: nginx_install is sameas true
    fail_msg: "PLEASE SET 'nginx_install: True' e.g. IN: /etc/iiab/local_vars.yml"
    quiet: yes

- name: Assert that "nginx_enabled | type_debug == 'bool'" (boolean not string etc)
  assert:
    that: nginx_enabled | type_debug == 'bool'
    fail_msg: "PLEASE GIVE VARIABLE 'nginx_enabled' A PROPER (UNQUOTED) ANSIBLE BOOLEAN VALUE e.g. IN: /etc/iiab/local_vars.yml"
    quiet: yes

- debug:
    var: nginx_install
- debug:
    var: nginx_enabled
- debug:
    var: nginx_installed


- name: Install NGINX if 'nginx_installed' not defined, e.g. in {{ iiab_state_file }}    # /etc/iiab/iiab_state.yml
  include_tasks: install.yml
  when: nginx_installed is undefined

# The distro-provided uwsgi-app@.service and uwsgi-app@.socket templates manage
# one app per systemd instance.
- name: Ensure uWSGI's app config directory exists
  file:
    path: /etc/uwsgi/apps-available
    state: directory
    mode: "0755"

- name: Check for the distro-provided uWSGI app service template
  stat:
    path: "{{ systemd_location }}/uwsgi-app@.service"
  register: uwsgi_app_service
  when: not is_proot

- name: Check for the distro-provided uWSGI app socket template
  stat:
    path: "{{ systemd_location }}/uwsgi-app@.socket"
  register: uwsgi_app_socket
  when: not is_proot

- name: Require the distro-provided uWSGI app service template
  assert:
    that:
      - uwsgi_app_service.stat.exists
      - uwsgi_app_socket.stat.exists
    fail_msg: "The installed uwsgi package must provide uwsgi-app@.service and uwsgi-app@.socket"
  when: not is_proot

- name: Stop and disable obsolete uWSGI services
  systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: no
  loop:
    - uwsgi-emperor
    - uwsgi
  ignore_errors: yes
  when: not is_proot

- name: Install uWSGI app service override directory
  file:
    path: /etc/systemd/system/uwsgi-app@.service.d
    state: directory
    mode: "0755"
  when: not is_proot

- name: Configure uWSGI app instances to run as {{ apache_user }}
  template:
    src: uwsgi-app@.service.d/iiab.conf.j2
    dest: /etc/systemd/system/uwsgi-app@.service.d/iiab.conf
    mode: "0644"
  when: not is_proot

- name: Install uWSGI app socket override directory
  file:
    path: /etc/systemd/system/uwsgi-app@.socket.d
    state: directory
    mode: "0755"
  when: not is_proot

- name: Configure uWSGI app sockets for {{ apache_user }}
  template:
    src: uwsgi-app@.socket.d/iiab.conf.j2
    dest: /etc/systemd/system/uwsgi-app@.socket.d/iiab.conf
    mode: "0644"
  when: not is_proot

- name: Reload systemd
  systemd_service:
    daemon_reload: yes
  when: not is_proot

- include_tasks: enable-or-disable.yml


- name: Add 'nginx' variable values to {{ iiab_ini_file }}
  ini_file:
    path: "{{ iiab_ini_file }}"    # /etc/iiab/iiab.ini
    section: nginx
    option: "{{ item.option }}"
    value: "{{ item.value | string }}"
  with_items:
    - option: name
      value: NGINX
    - option: description
      value: '"NGINX is a web server which can also be used as a reverse proxy, load balancer, mail proxy and HTTP cache."'
    - option: nginx_install
      value: "{{ nginx_install }}"
    - option: nginx_enabled
      value: "{{ nginx_enabled }}"
