---
# Record the reported settings after a successful apply.

- name: Add 'mysql' variable values to {{ iiab_ini_file }}
  ini_file:
    path: "{{ iiab_ini_file }}"    # /etc/iiab/iiab.ini
    section: mysql
    option: "{{ item.option }}"
    value: "{{ item.value | string }}"
  with_items:
    - option: name
      value: MySQL
    - option: description
      value: '"MySQL is a widely used free and open source (GPLv2) database, offered by most web hosting services, on a diversity of platforms."'
    - option: mysql_install
      value: "{{ mysql_install }}"
    - option: mysql_enabled
      value: "{{ mysql_enabled }}"

- name: "Add 'mysql_installed: True' to {{ iiab_state_file }}"
  iiab_state:
    key: mysql_installed
