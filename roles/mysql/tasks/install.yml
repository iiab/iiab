- name: Record (initial) disk space used
  shell: df -B1 --output=used / | tail -1
  register: df1


- name: 'Install MySQL packages: mariadb-server, mariadb-client, php{{ php_version }}-mysql'
  package:
    name:
      - mariadb-server
      - mariadb-client
      #- php{{ php_version }}-common    # Auto-installed as an apt dependency.  REGARDLESS: php{{ php_version }}-common superset php{{ php_version }}-cli is auto-installed by php{{ php_version }}-fpm in nginx/tasks/install.yml
      - php{{ php_version }}-mysql      # Likewise installed in nextcloud/tasks/install.yml, pbx/tasks/freepbx.yml, wordpress/tasks/install.yml
      #- python3-pymysql                # For Ansible modules {mysql_db, mysql_user} in Ansible collection community.mysql -- used in MySQL roles {mediawiki, nextcloud, wordpress} and possibly {elgg, pbx}
    state: present

- name: Ensure PHP MySQL extensions are enabled in php-fpm
  when: is_proot
  block:
    - name: Setup PHP MySQL extension (mysqli, pdo_mysql)
      command: phpenmod mysqli pdo_mysql
      register: php_mysql_exts
      changed_when: false
      failed_when: php_mysql_exts.rc != 0

    - name: Restart 'php-fpm' via pdsm (proot)
      command: pdsm restart php-fpm

- name: Ensure MariaDB log dir exists (proot)
  file:
    path: "{{ mariadb_log_dir }}"
    state: directory
    owner: mysql
    group: mysql
    mode: "0755"
  when: is_proot

- name: pip install 'PyMySQL' into venv /usr/local/ansible -- for Ansible modules {mysql_db, mysql_user} in Ansible collection community.mysql -- used in roles {mediawiki, nextcloud, wordpress, matomo, pbx}
  pip:
    name: PyMySQL
    virtualenv: /usr/local/ansible
    extra_args: "--upgrade --no-cache-dir --prefer-binary"    # 2023-10-01: Lifesaver when recent wheels (e.g. piwheels.org) are inevitably not yet built!  SEE #3560

# 2020-07-11: 10 PHP package installs moved to roles/www_base/tasks/main.yml
# php{{ php_version }}-sqlite3 install moved to roles/osm-vector-maps/tasks/install.yml

# 2021-08-11: 50 lines (6 stanzas) removed, that had been doubling MariaDB's
# default boot timeout (90s to 180s) since 2019-07-03, for slow CPUs like this
# Ubuntu 18.04.2 VM: https://github.com/iiab/iiab/issues/1802 -> PR #1813
# https://mariadb.com/kb/en/library/what-to-do-if-mariadb-doesnt-start/#systemd
# OS's have finally caught up - default timeout is now 900 seconds:
# https://github.com/iiab/iiab/pull/2936

- name: "Install /root/.my.cnf file from template -- used to contain root password credential, prior to 2020-08-24: https://github.com/iiab/iiab/pull/2488"
  template:
    src: my.cnf.j2
    dest: /root/.my.cnf
    owner: root
    mode: '0600'

# 2026-10-29: SAFE TO DELETE THE NEXT 2 TASKS WHEN /run/mysqld IS NO LONGER SUPPORTED -- e.g. WHEN IIAB REQUIRES UBUNTU 26.10+ AND DEBIAN 14+ ?
- name: Create unit file to symlink dir /run/mariadbd -> /run/mysqld during every boot, but only on older OS's
  copy:
    dest: /etc/systemd/system/mariadb-runtime-directory-symlink.service
    content: |
      [Unit]
      Description=Create MariaDB runtime directory symlink
      After=mariadb.service
      Requires=mariadb.service

      [Service]
      Type=oneshot
      ExecStart=/bin/sh -c 'if [ -d /run/mysqld ] && [ ! -e /run/mariadbd ] && [ ! -L /run/mariadbd ]; then ln -s /run/mysqld /run/mariadbd; fi'
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
  when: not is_proot

- name: Enable mariadb-runtime-directory-symlink.service
  systemd_service:
    name: mariadb-runtime-directory-symlink.service
    enabled: true
  when: not is_proot

- name: Daemon-reload and restart MySQL systemd service ({{ mysql_service }}) to permit configuration
  systemd_service:
    daemon_reload: yes
    name: "{{ mysql_service }}"
    state: restarted
  when: not is_proot

- name: Restart 'mysql' via pdsm (proot)
  command: pdsm restart mariadb
  when: is_proot

