---
# Reconcile MySQL's local client configuration on every apply.  Packages and
# the PyMySQL dependency are installed by install.yml (first install,
# --reinstall and --clean-install only).

- name: "Install /root/.my.cnf file from template -- used to contain root password credential, prior to 2020-08-24: https://github.com/iiab/iiab/pull/2488"
  template:
    src: my.cnf.j2
    dest: /root/.my.cnf
    owner: root
    mode: '0600'
