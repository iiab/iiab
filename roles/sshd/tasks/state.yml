---
# Record the reported settings after a successful apply.

- name: Add 'sshd' variable values to {{ iiab_ini_file }}
  ini_file:
    path: "{{ iiab_ini_file }}"    # /etc/iiab/iiab.ini
    section: sshd
    option: "{{ item.option }}"
    value: "{{ item.value | string }}"
  with_items:
    - option: name
      value: sshd
    - option: description
      value: '"Secure Shell daemon (typically implemented by openssh-server) for remote login using the ''ssh'' low-level protocol."'
    - option: sshd_install
      value: "{{ sshd_install }}"
    - option: sshd_enabled
      value: "{{ sshd_enabled }}"
    - option: sshd_port
      value: "{{ sshd_port }}"

- name: "Add 'sshd_installed: True' to {{ iiab_state_file }}"
  iiab_state:
    key: sshd_installed
