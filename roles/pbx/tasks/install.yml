- name: Install Asterisk
  include_tasks: asterisk.yml
  when: not lookup('installed', 'asterisk_installed') or reinstall

- name: Install FreePBX
  include_tasks: freepbx.yml


# Install & Enable chan_dongle for Huawei USB modems - if asterisk_chan_dongle
- name: Install & Enable chan_dongle for Huawei USB modems - if asterisk_chan_dongle
  include_tasks: chan_dongle.yml
  when: asterisk_chan_dongle
