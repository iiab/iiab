---
# Reconcile Kiwix's systemd unit and helper scripts on every apply.  The
# binaries and ZIM content are installed by install.yml (first install,
# --reinstall and --clean-install only).

- name: 'Install from templates: kiwix-serve.service, iiab-make-kiwix-lib, iiab-make-kiwix-lib.py'
  template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
  with_items:
    - { src: 'kiwix-serve.service.j2', dest: '/etc/systemd/system/kiwix-serve.service', mode: '0644' }
    - { src: 'iiab-make-kiwix-lib.j2', dest: '/usr/bin/iiab-make-kiwix-lib', mode: '0755' }
    - { src: 'iiab-make-kiwix-lib3.py', dest: '/usr/bin/iiab-make-kiwix-lib.py', mode: '0755' }

- name: daemon_reload, so systemd (re)reads newly installed kiwix-serve.service
  systemd:
    daemon_reload: yes
