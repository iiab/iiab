# "How do i fail a task in Ansible if the variable contains a boolean value?
# I want to perform input validation for Ansible playbooks"
# https://stackoverflow.com/questions/46664127/how-do-i-fail-a-task-in-ansible-if-the-variable-contains-a-boolean-value-i-want/46667499#46667499

# We assume 0-init/tasks/validate_vars.yml has DEFINITELY been run, so no need
# to re-check whether vars are defined here.  As Ansible vars cannot be unset:
# https://serverfault.com/questions/856729/how-to-destroy-delete-unset-a-variable-value-in-ansible

- name: Assert that "kiwix_install is sameas true" (boolean not string etc)
  assert:
    that: kiwix_install is sameas true
    fail_msg: "PLEASE SET 'kiwix_install: True' e.g. IN: /etc/iiab/local_vars.yml"
    quiet: yes

- name: Assert that "kiwix_enabled | type_debug == 'bool'" (boolean not string etc)
  assert:
    that: kiwix_enabled | type_debug == 'bool'
    fail_msg: "PLEASE GIVE VARIABLE 'kiwix_enabled' A PROPER (UNQUOTED) ANSIBLE BOOLEAN VALUE e.g. IN: /etc/iiab/local_vars.yml"
    quiet: yes


- name: Refresh IIAB Python libraries (the catalog builder imports iiab.iiab_zim_catalog)
  include_role:
    name: pylibs
  # Run here as well as in 4-server-options: ./runrole --reinstall kiwix does
  # not run stage 4, so an existing install would otherwise keep the old
  # module (or lack iiab_zim_catalog.py entirely).


- name: Install python3-libzim (scans ZIM metadata into the IIAB catalog)
  package:
    name: python3-libzim
    state: present
  # Runs on every invocation (not just fresh installs), so upgrades get it.
  # Available for all IIAB-supported OSes, including armhf.

- name: Install/refresh kiwix-serve.service, iiab-make-kiwix-lib and its builder
  template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
  with_items:
    - { src: 'kiwix-serve.service.j2', dest: '/etc/systemd/system/kiwix-serve.service', mode: '0644' }
    - { src: 'iiab-make-kiwix-lib.j2', dest: '/usr/bin/iiab-make-kiwix-lib', mode: '0755' }
    - { src: 'iiab-make-kiwix-lib3.py', dest: '/usr/bin/iiab-make-kiwix-lib.py', mode: '0755' }
  # Runs on every invocation, so an upgrade also updates the service's
  # --library path and the catalog builder.

- name: Refresh the PDSM Kiwix wrapper (Android upgrades skip proot_services)
  copy:
    src: "{{ role_path }}/../proot_services/files/pdsm/usr_local_pdsm/services-available/kiwix"
    dest: /usr/local/pdsm/services-available/kiwix
    mode: "0755"
  when: is_proot | default(false)
  # The wrapper is normally installed by the proot_services role, but that
  # role's install.yml only runs on a fresh install.  Refresh it here as well
  # so its KIWIX_LIBRARY path is updated before the builder runs.

- name: daemon_reload, so systemd (re)reads newly installed kiwix-serve.service
  systemd:
    daemon_reload: yes
  when: not (is_proot | default(false))


- block:

    - name: Install Kiwix if 'kiwix_installed' not defined, e.g. in {{ iiab_state_file }}    # /etc/iiab/iiab_state.yml
      include_tasks: install.yml
      when: kiwix_installed is undefined

    - include_tasks: enable-or-disable.yml

    - name: Add 'kiwix' variable values to {{ iiab_ini_file }}
      ini_file:
        path: "{{ iiab_ini_file }}"
        section: kiwix
        option: "{{ item.option }}"
        value: "{{ item.value | string }}"
      with_items:
        - option: name
          value: Kiwix
        - option: description
          value: '"Part of https://github.com/kiwix/kiwix-tools/ -- kiwix-serve is the most used web server for ZIM files."'
        - option: kiwix_install
          value: "{{ kiwix_install }}"
        - option: kiwix_enabled
          value: "{{ kiwix_enabled }}"
        - option: kiwix_tar_gz
          value: "{{ kiwix_tar_gz }}"
        - option: kiwix_url
          value: "{{ kiwix_url }}"
        - option: kiwix_url_plus_slash
          value: "{{ kiwix_url_plus_slash }}"
        - option: kiwix_path
          value: "{{ kiwix_path }}"
        - option: kiwix_port
          value: "{{ kiwix_port }}"
        - option: iiab_zim_path
          value: "{{ iiab_zim_path }}"
        - option: kiwix_library_path
          value: "{{ kiwix_library_path }}"
        - option: kiwix_library_xml
          value: "{{ kiwix_library_xml }}"    # legacy alias
        - option: zim_catalog_db
          value: "{{ zim_catalog_db }}"

  rescue:

    - name: 'SEE ERROR ABOVE (skip_role_on_error: {{ skip_role_on_error }})'
      fail:
        msg: ""
      when: not skip_role_on_error
