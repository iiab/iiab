---
# Record the reported settings after a successful apply.

- name: Add 'kiwix' variable values to {{ iiab_ini_file }}
  ini_file:
    path: "{{ iiab_ini_file }}"
    section: kiwix
    option: "{{ item.option }}"
    value: "{{ item.value | string }}"
  with_items:
    - option: name
      value: Kiwix
    - option: description
      value: '"Part of https://github.com/kiwix/kiwix-tools/ -- kiwix-serve is the most used web server for ZIM files."'
    - option: kiwix_install
      value: "{{ kiwix_install }}"
    - option: kiwix_enabled
      value: "{{ kiwix_enabled }}"
    - option: kiwix_tar_gz
      value: "{{ kiwix_tar_gz }}"
    - option: kiwix_url
      value: "{{ kiwix_url }}"
    - option: kiwix_url_plus_slash
      value: "{{ kiwix_url_plus_slash }}"
    - option: kiwix_path
      value: "{{ kiwix_path }}"
    - option: kiwix_port
      value: "{{ kiwix_port }}"
    - option: iiab_zim_path
      value: "{{ iiab_zim_path }}"
    - option: kiwix_library_xml
      value: "{{ kiwix_library_xml }}"

- name: "Add 'kiwix_installed: True' to {{ iiab_state_file }}"
  iiab_state:
    key: kiwix_installed
