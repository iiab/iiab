maps_dot_black_naturalearth6_symlink_name: "naturalearth6-NE2_HR_SR_W_DR-WEBP.pmtiles"

# "Minimal" maps that we want to give everybody regardless of their choice so that they
# have something to fall back to in case they choose a large file and decide to manually
# delete it.
maps_fallback_vector_zoom: nat-z8
maps_fallback_satellite_zoom: 7
maps_fallback_terrain_zoom: 0-none

# Store max zoom with the code rather than the catalog because we may want to warn users
# before FQRs suddenly become larger, give them options, etc.
maps_vector_fqr_max_zoom: 14
maps_satellite_fqr_max_zoom: 13
maps_terrain_fqr_max_zoom: 10

# Similar to pmtiles, search databases should follow this convention:
#
#   {search-engine}.{date}.full
#   {search-engine}.{date}.{subset}
#   {region-name}.fqr/{search-engine}.{date} (when we have search data in FQRs)
#
# Though:
#
# * backend databases such as nominatim will be in /library/maps while static will be under the serve directory
# * {subset} would be something like "pop-1k-cities"
# * "full" might not ever happen because it's a moving target and because there might not be an interest in
#   having all available subsets together (all cities + all lakes + all 7-11s etc)
#   * thus, we might end up with {subset} in FQRs

nominatim_db_symlink_name: nominatim.sqlite

static_search_symlink_name: world-map
