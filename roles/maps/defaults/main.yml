# NOTE: I'm more than happy to change the variable or directory names to
# something more in line with IIAB expectations.

unpkg_url: https://unpkg.com

maps_serve_path: "{{ content_base }}/www/maps"        # /library/www/maps
maps_data_root: "{{ content_base }}/maps"             # /library/maps
maps_fallback_path: "{{ maps_serve_path }}/fallback"  # /library/www/maps/fallback

nominatim_user: nominatim
nominatim_home: /srv/nominatim
nominatim_num_workers_procs: 1 # 4 seems to freeze it up if I make too many requests. But, maybe 1 is too few. Also, optimal on Pi Zero may be lower.
nominatim_venv: "{{ nominatim_home }}/nominatim-venv"

maps_static_search_dir: "static-search"
maps_static_search_root: "{{ maps_serve_path }}/{{ maps_static_search_dir }}"

# URL where we can find a catalog of all map data files available to download.
maps_catalog_url: "https://raw.githubusercontent.com/iiab/iiab/refs/heads/master/roles/maps/maps-catalog.json"

# This is where the catalog is kept static to avoid unwanted updates when
# running ansible. This does not apply to FQRs hence the "global". FQRs will
# always download the latest catalog.
maps_orig_global_catalog: "{{ maps_serve_path }}/maps-catalog-global-orig.json"

maps_tools:
  base_dir: "/opt/iiab/maps"
  pmtiles:
    # Custom build: upstream v1.31.2 + parallel range downloads and resumable
    # downloads with JSON progress. Source: https://github.com/chapmanjacobd/go-pmtiles
    # (PRs #1 and #2). See "How to speed up or monitor Full Quality Region downloads"
    # in README.md.
    releases:
      armhf:
        src_url: https://iiab.switnet.org/binaries/pmtiles-1.31.2-m16/go-pmtiles_1.31.2-m16_Linux_armv7.tar.gz
        sha256sum: 3ca57c093c915906546bff251b02627682c134385f7cde2ff101b2aa360efaf3
      arm64:
        src_url: https://iiab.switnet.org/binaries/pmtiles-1.31.2-m16/go-pmtiles_1.31.2-m16_Linux_arm64.tar.gz
        sha256sum: c43bcdf275ac6eaf63504c36a9e0c674ff7b22396d6affa9bc76e84432c6a757
      amd64:
        src_url: https://iiab.switnet.org/binaries/pmtiles-1.31.2-m16/go-pmtiles_1.31.2-m16_Linux_x86_64.tar.gz
        sha256sum: b2f2e522e624d7ffc4a1079398635e323a41332c4b8124bdd1b243eb76cf2c55
    archive_tmp_dir: "/opt/iiab/downloads/maps/pmtiles"
    archive_tmp_file: "/opt/iiab/downloads/maps/pmtiles/pmtiles.tar.gz"
    executable_path: "{{ maps_tools.base_dir }}/pmtiles"
  tile_extract:
    working_dir: "{{ maps_tools.base_dir }}/tile-extract"

# Basic maps.black javascript and styles
maps_dot_black_js_and_styles_host: https://iiab.switnet.org/maps/2
maps_dot_black_js_and_styles:

#    NOTE: We are now building `maps.black.js` ourselves because we want to
#    make changes to it. See the `build-maps.black-assets/` directory.
#
#    This sha256sum represents the original version before any changes we've
#    made. The other two files are from the same "version" of maps.black; if we
#    update one, we should update the rest.
#
#  - name: maps.black.js
#  -    filename: maps.black.js
#  -    sha256sum: 7b3843b5ded151d585ccf3a6db02093e3a95851be36dcffc5fa92030657b9c93

  - "{{ maps_dot_black_js_and_styles_host }}/maps.black-component.js"
  - "{{ maps_dot_black_js_and_styles_host }}/resourcetiles-minimal.pmtiles"

