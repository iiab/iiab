- name: Make index file
  template:
    src: index.html.j2
    dest: "{{ maps_serve_path }}/index.html"

### maps.black ###

- name: Install maps.black.js
  copy:
    src: maps.black.js
    dest: "{{ maps_serve_path }}/maps.black.js"
    mode: "0644"

- name: Download the remaining basic maps.black javascript and styles (0644)
  include_tasks: download_large_file.yml
  vars:
    dest_base_path: "{{ maps_serve_path }}"
  with_items: "{{ maps_dot_black_js_and_styles }}"

- name: Get naturalearth6 from catalog
  include_tasks: download_from_catalog.yml
  vars:
    catalog_item: naturalearth6
    catalog_item_config_var: maps_ne6_zoom
    symlink_name: "{{ maps_dot_black_naturalearth6_symlink_name }}"
    dest_base_path: "{{ maps_serve_path }}"


- name: "Make sure (only) unused versions of selected pmtiles files have .old extension"
  # * Only for vector, satellite, and terrain files, since those are the ones that most implementers care about.
  # * Rename .pmtiles files to .pmtiles.old if the implementer switches to a different version.
  # * Rename .pmtiles.old files back to .pmtiles in case the implementer switches back to a previously selected version.
  # * Don't touch the "fallback" files in the /fallback subdirectory.
  shell: |
    from pathlib import Path
    import re

    DATA_KEYS = [
      "terrarium",
      "openstreetmap-openmaptiles",
      "naturalearth-openmaptiles",
      "s2maps-sentinel2-2023",
      'iiab-sentinel2',
    ]

    # log = open("/tmp/old-rename.log", "a")
    def debug(*ss):
        return
        log.write(" ".join(str(s) for s in ss))
        log.write("\n\n")
        log.flush()

    def old(path):
        return path.parent / (path.name + ".old")

    def rename(from_path, to_path):
        debug("rename", from_path, to_path)
        if from_path.exists() and to_path.exists():
            debug("oops both exist", from_path, to_path)
            raise Exception(f"Found both '{from_path}' and '{to_path}'. Please delete one of them.")
        from_path.rename(to_path)

    maps_serve_path = Path("{{ maps_serve_path }}")

    selected_pmtiles = [
      Path(maps_serve_path) / url.split("/")[-1]
      for url
      in [
        "{{ maps_catalog.data['satellite'][maps_satellite_zoom | string] | default('') }}",
        "{{ maps_catalog.data['vector'][maps_vector_zoom       | string] | default('') }}",
        "{{ maps_catalog.data['terrain'][maps_terrain_zoom     | string] | default('') }}",
      ]
      if url
    ]
    debug("selected_pmtiles", selected_pmtiles)

    for selected_item in selected_pmtiles:
        debug("selected_item", selected_item)
        if old(selected_item).exists():
            debug("rename selected_item")
            rename(old(selected_item), selected_item)

    for pmtiles_file in maps_serve_path.glob("*.pmtiles"):
        debug(pmtiles_file, "found")
        if pmtiles_file in selected_pmtiles:
            continue
        debug(pmtiles_file, "not selected_pmtiles")
        match (pmtiles_file.name.split('.')):
            case [data_key, date, depth, "pmtiles"]:
                debug(data_key, date, depth, "split")
                if data_key not in DATA_KEYS:
                    continue
                debug(data_key, date, depth, "in DATA_KEYS")
                if not re.fullmatch(r'\d{4}-\d{2}-\d{2}', date, re.ASCII):
                    continue
                debug(data_key, date, depth, "date valid")
                if not re.fullmatch(r'z\d{2}-z\d{2}', depth, re.ASCII):
                    continue
                debug(data_key, date, depth, "depth valid")
                rename(pmtiles_file, old(pmtiles_file))
            case not_matched:
                debug("not_matched", not_matched)

  args:
    executable: /usr/bin/python3

- name: Get vector from catalog
  include_tasks: download_from_catalog.yml
  when: maps_vector_zoom != maps_fallback_vector_zoom
  vars:
    catalog_item: vector
    catalog_item_config_var: maps_vector_zoom
    symlink_name: "{{ maps_dot_black_osm_symlink_name }}"
    dest_base_path: "{{ maps_serve_path }}"

- name: Download fallback vector tiles
  include_tasks: download_large_file.yml
  vars:
    dest_base_path: "{{ maps_fallback_path }}"
    item: "{{ maps_catalog.data.vector[maps_fallback_vector_zoom | string] }}"

- name: Get satellite from catalog
  include_tasks: download_from_catalog.yml
  when: (maps_satellite_zoom != "none") and (maps_satellite_zoom != maps_fallback_satellite_zoom)
  vars:
    catalog_item: satellite
    catalog_item_config_var: maps_satellite_zoom
    symlink_name: "{{ maps_dot_black_satellite_symlink_name }}"
    dest_base_path: "{{ maps_serve_path }}"

- name: Download fallback satellite tiles
  include_tasks: download_large_file.yml
  when: maps_satellite_zoom != "none"
  vars:
    dest_base_path: "{{ maps_fallback_path }}"
    item: "{{ maps_catalog.data.satellite[maps_fallback_satellite_zoom | string] }}"

- name: Remove unused satellite symlink
  when: maps_satellite_zoom == "none"
  file:
    path: "{{ maps_serve_path }}/{{ maps_dot_black_satellite_symlink_name }}"
    state: absent

# Unlike with satellite, if the user selects "none" for terrain, we download a dummy file
- name: Get terrain from catalog
  include_tasks: download_from_catalog.yml
  when: maps_terrain_zoom != maps_fallback_terrain_zoom
  vars:
    catalog_item: terrain
    catalog_item_config_var: maps_terrain_zoom
    symlink_name: "{{ maps_dot_black_terrain_symlink_name }}"
    dest_base_path: "{{ maps_serve_path }}"

- name: Download fallback terrain tiles
  include_tasks: download_large_file.yml
  vars:
    dest_base_path: "{{ maps_fallback_path }}"
    item: "{{ maps_catalog.data.terrain[maps_fallback_terrain_zoom | string] }}"

# maps-update.py is used here but it can also be run independently. As we use
# it here, we take advantage of its handling of pmtiles zoom levels. It only
# partially handles symlink repairs for now so we still need to set symlinks
# by other means.
- name: "Final map configuration"
  shell: |
    set -euo pipefail
    {{ maps_tools.base_dir }}/maps-update.py
  args:
    executable: /bin/bash

- name: "Download preset full quality regions"
  # TODO - Is there a safer way to pass in item.name and item.bbox?
  shell: |
    set -euo pipefail
    {{ maps_tools.tile_extract.working_dir }}/tile-extract.py extract {{ item.name }} {{ item.bbox }} noninteractive
  args:
    executable: /bin/bash
  with_items: "{{ maps_preset_full_quality_regions }}"

### maplibre ###

- name: Download maplibre javascript and styles (0644)
  get_url:
    url: "{{ unpkg_url }}/{{ item.url_subpath }}"
    dest: "{{ maps_serve_path }}/{{ item.filename }}"
    checksum: "sha256:{{ item.sha256sum }}"
    mode: "0644"
    timeout: "{{ download_timeout }}"
  with_items: "{{ maplibre_js_and_styles }}"
