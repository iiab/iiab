- name: Make index file
  template:
    src: index.html.j2
    dest: "{{ maps_serve_path }}/index.html"

### maps.black ###

- name: Install maps.black.js
  copy:
    src: maps.black.js
    dest: "{{ maps_serve_path }}/maps.black.js"
    mode: "0644"

- name: Download the remaining basic maps.black javascript and styles (0644)
  include_tasks: download_large_file.yml
  vars:
    dest_base_path: "{{ maps_serve_path }}"
  with_items: "{{ maps_dot_black_js_and_styles }}"

- name: Get naturalearth6 from catalog
  include_tasks: download_from_catalog.yml
  vars:
    catalog_item: naturalearth6
    catalog_item_config_var: maps_ne6_zoom
    symlink_name: "{{ maps_dot_black_naturalearth6_symlink_name }}"
    dest_base_path: "{{ maps_serve_path }}"

# Put this in a file because there's a lot of repeat code
- name: Install handle-unused-pmtiles.py
  template:
    src: "handle-unused-pmtiles.py.j2"
    dest: "{{ maps_tools.base_dir }}/handle-unused-pmtiles.py"
    mode: "0755"

- name: "Rename any selected pmtiles from .old.pmtiles to .pmtiles"
  shell: |
    set -euo pipefail
    {{ maps_tools.base_dir }}/handle-unused-pmtiles.py selected
  args:
    executable: /bin/bash

- name: Get vector from catalog
  include_tasks: download_from_catalog.yml
  when: maps_vector_zoom != maps_fallback_vector_zoom
  vars:
    catalog_item: vector
    catalog_item_config_var: maps_vector_zoom
    dest_base_path: "{{ maps_serve_path }}"

- name: Download fallback vector tiles
  include_tasks: download_from_catalog.yml
  # Don't get the small fallback when we just want a super-small CI
  when: not is_github_ci
  vars:
    catalog_item: vector
    catalog_item_config_var: maps_fallback_vector_zoom
    dest_base_path: "{{ maps_fallback_path }}"

- name: Get satellite from catalog
  include_tasks: download_from_catalog.yml
  when: (maps_satellite_zoom != "none") and (maps_satellite_zoom != maps_fallback_satellite_zoom)
  vars:
    catalog_item: satellite
    catalog_item_config_var: maps_satellite_zoom
    dest_base_path: "{{ maps_serve_path }}"

- name: Download fallback satellite tiles
  include_tasks: download_from_catalog.yml
  # Don't get the small fallback when we just want a super-small CI
  when: (not is_github_ci) and (maps_satellite_zoom != "none")
  vars:
    catalog_item: satellite
    catalog_item_config_var: maps_fallback_satellite_zoom
    dest_base_path: "{{ maps_fallback_path }}"

# Unlike with satellite, if the user selects "none" for terrain, we download a dummy file
- name: Get terrain from catalog
  include_tasks: download_from_catalog.yml
  when: maps_terrain_zoom != maps_fallback_terrain_zoom
  vars:
    catalog_item: terrain
    catalog_item_config_var: maps_terrain_zoom
    dest_base_path: "{{ maps_serve_path }}"

- name: Download fallback terrain tiles
  include_tasks: download_from_catalog.yml
  vars:
    catalog_item: terrain
    catalog_item_config_var: maps_fallback_terrain_zoom
    dest_base_path: "{{ maps_fallback_path }}"

- name: "Rename any previously selected pmtiles from .pmtiles to .old.pmtiles"
  shell: |
    set -euo pipefail
    {{ maps_tools.base_dir }}/handle-unused-pmtiles.py unselected
  args:
    executable: /bin/bash

- name: "Download preset full quality regions"
  # TODO - Is there a safer way to pass in item.name and item.bbox?
  shell: |
    set -euo pipefail
    {{ maps_tools.tile_extract.working_dir }}/tile-extract.py extract {{ item.name }} {{ item.bbox }} noninteractive
  args:
    executable: /bin/bash
  with_items: "{{ maps_preset_full_quality_regions }}"

### maplibre ###

- name: Download maplibre javascript and styles (0644)
  get_url:
    url: "{{ unpkg_url }}/{{ item.url_subpath }}"
    dest: "{{ maps_serve_path }}/{{ item.filename }}"
    checksum: "sha256:{{ item.sha256sum }}"
    mode: "0644"
    timeout: "{{ download_timeout }}"
  with_items: "{{ maplibre_js_and_styles }}"
