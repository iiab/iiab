---
# Record the reported settings after a successful apply.

- name: Add 'maps' variable values to {{ iiab_ini_file }}
  ini_file:
    path: "{{ iiab_ini_file }}"    # /etc/iiab/iiab.ini
    section: maps
    option: "{{ item.option }}"
    value: "{{ item.value | string }}"
  with_items:
    - option: name
      value: Maps
    - option: description
      value: 'OpenStreetMap streets, satellite imagery, and search.'
    - option: maps_install
      value: "{{ maps_install }}"
    - option: maps_enabled
      value: "{{ maps_enabled }}"
    - option: maps_region_downloader
      value: "{{ maps_region_downloader }}"
    - option: maps_vector_zoom
      value: "{{ maps_vector_zoom }}"
    - option: maps_satellite_zoom
      value: "{{ maps_satellite_zoom }}"
    - option: maps_terrain_zoom
      value: "{{ maps_terrain_zoom }}"
    - option: maps_search_engine
      value: "{{ maps_search_engine }}"
    - option: maps_search_nominatim_db
      value: "{{ maps_search_nominatim_db }}"
    - option: maps_search_static_db
      value: "{{ maps_search_static_db }}"
    - option: maps_preset_full_quality_regions
      value: "{{ maps_preset_full_quality_regions }}"
    - option: maps_ne6_zoom
      value: "{{ maps_ne6_zoom }}"

- name: "Add 'nominatim_installed: True' to {{ iiab_state_file }}"
  iiab_state:
    key: nominatim_installed
  when: maps_search_engine == "nominatim"

- name: "Add 'maps_installed: True' to {{ iiab_state_file }}"
  iiab_state:
    key: maps_installed
