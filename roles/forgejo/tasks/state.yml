---
# Record the reported settings after a successful apply.

- name: Add 'forgejo' variable values to {{ iiab_ini_file }}
  ini_file:
    path: "{{ iiab_ini_file }}"    # /etc/iiab/iiab.ini
    section: forgejo
    option: "{{ item.option }}"
    value: "{{ item.value | string }}"
  with_items:
    - option: name
      value: Forgejo
    - option: description
      value: 'Forgejo, self-hosted Git service.'
    - option: forgejo_install
      value: "{{ forgejo_install }}"
    - option: forgejo_enabled
      value: "{{ forgejo_enabled }}"
    - option: forgejo_url
      value: "{{ forgejo_url }}"
    - option: forgejo_port
      value: "{{ forgejo_port }}"

- name: "Add 'forgejo_installed: True' to {{ iiab_state_file }}"
  iiab_state:
    key: forgejo_installed
