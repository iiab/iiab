# Standalone Forgejo update flow. NOT included by tasks/main.yml, so it never runs
# during install. Invoke it out-of-band, e.g. with a small playbook:
#
#   - hosts: localhost
#     connection: local
#     tasks:
#       - include_role:
#           name: forgejo
#           tasks_from: update
#
# It backs up the DB, downloads/verifies the target binary, repoints the stable
# symlink and restarts the service (migrations run on start). See ADR.md D2/D6.

- name: Fail if Forgejo is not installed yet
  assert:
    that: forgejo_installed is defined
    fail_msg: "Forgejo is not installed; run the role (install) first."
    quiet: yes

# Optionally resolve the newest LTS patch from the Codeberg API (opt-in).
# NOTE: string sort is fine within a same-length patch series; a version-aware
# sort may be needed once patch numbers reach two digits (e.g. 15.0.10).
- name: Resolve newest v{{ forgejo_lts_major }}.x from Codeberg (if forgejo_track_latest_lts)
  when: forgejo_track_latest_lts | bool
  block:
    - name: Query Forgejo releases
      uri:
        url: "https://codeberg.org/api/v1/repos/forgejo/forgejo/releases?limit=50"
        return_content: yes
      register: forgejo_releases

    - name: Set forgejo_version to the newest non-prerelease LTS patch
      set_fact:
        forgejo_version: >-
          {{ forgejo_releases.json
             | rejectattr('prerelease')
             | map(attribute='tag_name')
             | select('match', '^v' ~ forgejo_lts_major ~ '\.')
             | map('regex_replace', '^v', '')
             | sort(reverse=true)
             | first }}

- name: Read current Forgejo symlink target
  stat:
    path: "{{ forgejo_link_path }}"
  register: forgejo_link_stat

- name: Decide whether an update is needed
  set_fact:
    forgejo_update_needed: "{{ (forgejo_link_stat.stat.lnk_target | default('') | basename) != ('forgejo-' ~ forgejo_version) }}"

- name: Report target
  debug:
    msg: "Target Forgejo {{ forgejo_version }} ({{ forgejo_install_path }}); update needed: {{ forgejo_update_needed }}"

- name: Perform the update
  when: forgejo_update_needed | bool
  block:
    - name: Ensure backups directory exists
      file:
        path: "{{ forgejo_backups_root }}"
        state: directory
        owner: "{{ forgejo_user }}"
        group: "{{ forgejo_user }}"
        mode: "0750"

    - name: Back up Forgejo (forgejo dump) before migrating
      command: >
        {{ forgejo_link_path }} dump
        --config {{ forgejo_config_path }}
        --file {{ forgejo_backups_root }}/forgejo-dump-{{ ansible_date_time.iso8601_basic_short }}.zip
      args:
        chdir: "{{ forgejo_backups_root }}"
      become: yes
      become_user: "{{ forgejo_user }}"

    - name: Download new Forgejo binary {{ forgejo_download_url }}
      get_url:
        url: "{{ forgejo_download_url }}"
        dest: "{{ forgejo_install_path }}"
        mode: "0775"
        timeout: "{{ download_timeout }}"

    - name: Download new Forgejo GPG signature
      get_curl:
        url: "{{ forgejo_asc_url }}"
        dest: "{{ forgejo_asc_path }}"
        timeout: "{{ download_timeout }}"

    - name: Verify new binary with GPG signature (best-effort, non-fatal)
      shell: |
        gpg --keyserver keys.openpgp.org --recv {{ forgejo_gpg_key }}
        gpg --verify {{ forgejo_asc_path }} {{ forgejo_install_path }}
      ignore_errors: yes

    - name: Repoint stable symlink {{ forgejo_link_path }} -> {{ forgejo_install_path }}
      file:
        src: "{{ forgejo_install_path }}"
        path: "{{ forgejo_link_path }}"
        owner: "{{ forgejo_user }}"
        group: "{{ forgejo_user }}"
        state: link
        force: yes

    - name: Restart 'forgejo' systemd service (not proot) - migrations run on start
      systemd:
        name: forgejo
        state: restarted
      when: not is_proot

    - name: Restart 'forgejo' via pdsm (proot) - migrations run on start
      command: pdsm restart forgejo
      when: is_proot
