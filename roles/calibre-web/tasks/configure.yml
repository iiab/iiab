---
# Reconcile Calibre-Web's systemd unit on every apply.  The virtualenv,
# library and configuration database are installed by install.yml (first
# install, --reinstall and --clean-install only).

- name: Install /etc/systemd/system/calibre-web.service from template
  template:
    src: calibre-web.service.j2
    dest: /etc/systemd/system/calibre-web.service
