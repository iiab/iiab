# 2025-09-15: These asserts were temporarily spelled out exhaustively, as
# ansible-core 2.19 banned var names derived from {{ }} string templating
# inside 'that:' conditionals -- see: https://github.com/iiab/iiab/issues/4030
#
# 2026-10-17: RESTORED to 1 loop task!  The 'varnames' lookup below never
# builds a var name via templating (it's a pure Jinja expression), so it works
# fine on ansible-core 2.19/2.20+.
# https://docs.ansible.com/ansible/latest/collections/ansible/builtin/varnames_lookup.html
#
# 2023-12-04 (still relevant!): ansible-core 2.16.1 no longer allows 'assert'
# with 'with_items' (whereas the 'loop' construct below works!)  BACKGROUND:
#
#  'due to mitigation of security issue CVE-2023-5764 in ansible-core 2.16.1,
#  conditional expressions with embedded template blocks can fail with the
#  message "Conditional is marked as unsafe, and cannot be evaluated."'
#  https://docs.ansible.com/ansible-core/2.16/porting_guides/porting_guide_core_2.16.html#playbook
#
# 2026-10-17: Deprecated vars are listed in vars_deprecated_list in
# validate_vars.yml -- add new entries there!

# UNMAINTAINED...
# xo_services
# activity_server
# ejabberd_xs
# idmgr
# dokuwiki
# ejabberd
# elgg

# LET'S DEPRECATE THESE SOON TOO...
# lokole (or maybe it's coming back to life in 2026!?)
# kalite (2026-03-25 ADVISE: KA Lite is *completely going away* within 90 days)

- name: "DISALLOW 'XYZ_install' (deprecated vars) ...for all {{ vars_deprecated_list | length }} entries"
  assert:
    that: "lookup('varnames', '^' + item + '_install$') | length == 0"
    fail_msg: "DISALLOWED: '{{ item }}_install:' (e.g. in /etc/iiab/local_vars.yml)"
    quiet: yes
  loop: "{{ vars_deprecated_list }}"
