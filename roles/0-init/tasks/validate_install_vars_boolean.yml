# 2025-09-15: These ~47 asserts were temporarily spelled out exhaustively, as
# ansible-core 2.19 banned var names derived from {{ }} string templating
# inside 'that:' conditionals -- see: https://github.com/iiab/iiab/issues/4030
#
# 2026-10-17: RESTORED to 1 loop task!  The 'vars' lookup below never builds
# a var name via templating (it's a pure Jinja expression), so it works fine
# on ansible-core 2.19/2.20+ -- unlike "{{ item }}_install | type_debug".
# https://docs.ansible.com/ansible/latest/collections/ansible/builtin/vars_lookup.html

- name: "Assert that all {{ vars_checklist | length }} 'XYZ_install' vars are type boolean (NOT type string, which can invert logic!)"
  assert:
    that: "lookup('vars', item + '_install') | type_debug == 'bool'"
    fail_msg: "VARIABLE MUST BE BOOLEAN: '{{ item }}_install' now has type '{{ lookup('vars', item + '_install') | type_debug }}' and value '{{ lookup('vars', item + '_install') }}' -- PLEASE SET A PROPER (UNQUOTED) ANSIBLE BOOLEAN VALUE e.g. IN: /etc/iiab/local_vars.yml"
    quiet: yes
  loop: "{{ vars_checklist }}"
