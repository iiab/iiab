# 2020-01-21: Ansible Input Validation (basic sanity checking for now) to check
# that *_install and *_enabled variables (as set in places like
# /etc/iiab/local_vars.yml) appear coherent i.e. (1) are confirmed defined,
# (2) have type boolean (Ansible often inverts logic when boolean vars are
# accidentally declared as strings, see below!) and (3) have plausible values.

# 2020-01-23: *_installed markers (in /etc/iiab/iiab_state.yml) are read with
# the 'installed' lookup and are not required to be boolean (or even defined!).
# However if any marker is true, the corresponding value of *_install must be
# True unless the role is being uninstalled (which removes the marker only
# after cleanup succeeds).  Only roles that implement --uninstall can do that;
# see './runrole --list'.

# Stricter validation is needed later, when roles/playbooks/tasks are invoked
# by various scripts, possibly bypassing 0-init?  Either way, risks abound :/

# 1. "Ansible 2.8+ ADVISORY: avoid warnings by using 'when: var | bool' for
# top-level BARE vars (in case they're strings, instead of boolean)" per #1632.
# 2020-10-16: NO LONGER NEC, SEE: https://github.com/iiab/iiab/pull/2576

# 2. "How Exactly Does Ansible Parse Boolean Variables?"
# https://stackoverflow.com/questions/47877464/how-exactly-does-ansible-parse-boolean-variables/47877502#47877502
# ...is very helpful but has it slightly wrong, as Ansible implements only ~18
# of YAML's 22 definitions of boolean (https://yaml.org/type/bool.html).
# i.e. Ansible fails to implement y|Y|n|N, only allowing ~18 boolean values:
#
# yes|Yes|YES|no|No|NO
# |true|True|TRUE|false|False|FALSE
# |on|On|ON|off|Off|OFF
#
# Otherwise 'var != (var | bool)' is dangerously common, e.g. (1) when a var
# is not one of the above ~18 words (forcing it to become a string) or (2) when
# a var is accidentally set using quotes (forcing it to become a string) these
# ~18 words too WILL FAIL as strings (as will any non-empty string...so beware
# casting strings to boolean later on...can make the situation worse!)
# https://docs.ansible.com/ansible/latest/porting_guides/porting_guide_2.8.html#bare-variables-in-conditionals
#
# 2020-07-08 - Excellent analysis & summary by Jon Spriggs: "In Ansible,
# determine the type of a value, and casting those values to other types"
# https://jon.sprig.gs/blog/post/1801
#
# 2021-01-29 - ansible-base 2.10.5 (1) is more strict about empty string vars
# (2) no longer supports "when: myvar is boolean", "is integer" & "is float"
# (3) brings yet more "Ansible Collections" dependency changes (undocumented!)
# Details: https://github.com/iiab/iiab/pull/2672 (see also #2669)

# 3. "How do i fail a task in Ansible if the variable contains a boolean value?
# I want to perform input validation for Ansible playbooks"
# https://stackoverflow.com/questions/46664127/how-do-i-fail-a-task-in-ansible-if-the-variable-contains-a-boolean-value-i-want/46667499#46667499

# 2020-01-23: Checks 53 + 53 + up-to-53 vars...for now...expect this to change!
# 2020-09-26: Commented out 14 vars that are {mandatory, dependencies, or
# unmaintained-for-years} for IIAB 7.2 release.  Keeping in mind that vars
# will come and go as IIAB evolves, let's try to keep these 9 aligned:
#
# http://FAQ.IIAB.IO > "What services (IIAB apps) are suggested during installation?"
# https://github.com/iiab/iiab/blob/master/vars/local_vars_min.yml
# https://github.com/iiab/iiab/blob/master/vars/local_vars_medium.yml
# https://github.com/iiab/iiab/blob/master/vars/local_vars_big.yml
# https://github.com/iiab/iiab/blob/master/vars/default_vars.yml
# https://github.com/iiab/iiab/blob/master/unmaintained-roles.txt
# https://github.com/iiab/iiab/blob/master/roles/0-DEPRECATED-ROLES/
# https://github.com/iiab/iiab/blob/master/tests/test.yml
# https://github.com/iiab/iiab/blob/master/roles/0-init/tasks/validate_vars.yml
#
# 2020-11-04: Fix validation of 5 [now 4] core dependencies, for ./runrole etc


# 2025-09-15: ansible-core 2.19 suddenly DISALLOWS variable names derived from
# (instantiated from) strings -- see: https://github.com/iiab/iiab/issues/4030
# So validation tests were temporarily spelled out exhaustively in these 7
# subtasks (i.e. ~47 hand-written asserts per subtask, ~310 tasks in all).
#
# 2026-10-17: RESTORED to loops (again!).  ansible-core 2.19+ only bans {{ }}
# template blocks inside 'that:' conditionals -- whose instantiated output gets
# flagged as an "unsafe" string.  Pure Jinja EXPRESSIONS such as the 'varnames'
# and 'vars' LOOKUPS used in these subtasks never build var names via
# templating, so they sail straight through ansible-core 2.19/2.20+!  (Unlike
# the deprecated 'vars' magic dict, which is being removed in ansible-core
# 2.24, the 'vars' LOOKUP below remains fully supported.)
# https://docs.ansible.com/ansible/latest/collections/ansible/builtin/varnames_lookup.html
# https://docs.ansible.com/ansible/latest/collections/ansible/builtin/vars_lookup.html
#
# Each of the 6 validation subtasks below is again just 1 task, looping over
# the ~48 vars in vars_checklist below!  (As before 2025-09-15 -- and FYI,
# 'loop' also sidesteps the 2023-12-04 'with_items' breakage caused by the
# CVE-2023-5764 mitigation in ansible-core 2.16.1.)

- name: Set vars_checklist_all for ~48 + ~48 vars ("XYZ_install" + "XYZ_enabled") to be checked
  set_fact:
    vars_checklist_all:
      - hostapd
      - dnsmasq
      - bluetooth
      - sshd
      - tailscale
      - remoteit
      - proot_services
      - admin_console
      - squid
      - cups
      - samba
      - usb_lib
      - azuracast
      - forgejo
      - gitea
      - jupyterhub
      - lokole
      - mysql
      - mediawiki
      - mosquitto
      - nodejs
      - nodered
      - nextcloud
      - wordpress
      - kolibri
      - kiwix
      - postgresql
      - moodle
      - mongodb
      - sugarizer
      - osm_vector_maps
      - maps
      - transmission
      - awstats
      - matomo
      - monit
      - munin
      - phpmyadmin
      - vnstat
      - captiveportal
      - internetarchive
      - luanti
      - calibreweb
      - calibre
      - code
      - pbx
      - network
      - nginx

- name: Set vars_deprecated_list for 4 deprecated vars ("XYZ_install") to be checked
  set_fact:
    vars_deprecated_list:
      - dhcpd               # Deprecated
      - named               # Deprecated
      - wondershaper        # Deprecated
      - dansguardian        # Deprecated
      #- kalite             # 2026-03-25 ADVISE: KA Lite is *completely going away* within 90 days -- UNCOMMENT kalite right here, when ready!

# Error messages name the role as well as its variable prefix, so users can copy
# the './runrole --uninstall <role>' command without translating e.g.
# 'calibreweb' to 'calibre-web'.  Keep this aligned with ROLE_VAR_OVERRIDES in
# scripts/role_lifecycle.py.
- name: Map variable prefixes to role names for error messages
  set_fact:
    var_role_names:
      calibreweb: calibre-web
      osm_vector_maps: osm-vector-maps
      admin_console: iiab-admin

# ./runrole passes 'validate_roles' (a list of variable prefixes)
# so a debugging run checks only the role(s) it was asked to run.  Full plays
# leave the variable undefined, which keeps the complete check.
- name: Narrow vars_checklist to the role(s) being run
  set_fact:
    vars_checklist: >-
      {{ vars_checklist_all
         if validate_roles is not defined
         else (vars_checklist_all | intersect(validate_roles)) }}

- name: VERIFY that all ~48 APP_install vars are DEFINED
  include_tasks: validate_install_vars_defined.yml
  when: not uninstall
- name: VERIFY that all ~48 APP_enabled vars are DEFINED
  include_tasks: validate_enabled_vars_defined.yml
  when: not uninstall

- name: VERIFY that all ~48 APP_install vars are BOOLEAN
  include_tasks: validate_install_vars_boolean.yml
  when: not uninstall
- name: VERIFY that all ~48 APP_enabled vars are BOOLEAN
  include_tasks: validate_enabled_vars_boolean.yml
  when: not uninstall

- name: VERIFY that all ~48 APP_install vars DON'T CONTRADICT THEIR APP_enabled vars
  include_tasks: disallow_install_false_with_enabled_true.yml
  when: not uninstall
- name: VERIFY that all ~48 APP_install vars DON'T CONTRADICT THEIR APP_installed vars
  include_tasks: disallow_install_false_with_installed_defined.yml
  when: not uninstall

- name: VERIFY that 4 deprecated APP_install vars are NO LONGER IN USE
  include_tasks: disallow_deprecated_install_vars.yml
  when:
    - validate_roles is not defined
    - not uninstall
