# 2025-09-15: These ~47 asserts were temporarily spelled out exhaustively, as
# ansible-core 2.19 banned var names derived from {{ }} string templating
# inside 'that:' conditionals -- see: https://github.com/iiab/iiab/issues/4030
#
# 2026-10-17: RESTORED to 1 loop task!  The 'vars' lookups below never build
# var names via templating (they're pure Jinja expressions), so they work fine
# on ansible-core 2.19/2.20+.
# https://docs.ansible.com/ansible/latest/collections/ansible/builtin/vars_lookup.html

- name: 'DISALLOW "XYZ_install: False" WITH "XYZ_enabled: True" ...for all {{ vars_checklist | length }} var pairs'
  assert:
    that: "lookup('vars', item + '_install') or not lookup('vars', item + '_enabled')"
    fail_msg: "DISALLOWED: '{{ item }}_install: False' WITH '{{ item }}_enabled: True' -- IIAB DOES NOT SUPPORT UNINSTALLS -- please verify those 2 variable values e.g. in /etc/iiab/local_vars.yml, and other places variables are defined?"
    quiet: yes
  loop: "{{ vars_checklist }}"
