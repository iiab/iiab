# 2025-09-15: These ~47 asserts were temporarily spelled out exhaustively, as
# ansible-core 2.19 banned var names derived from {{ }} string templating
# inside 'that:' conditionals -- see: https://github.com/iiab/iiab/issues/4030
#
# 2026-10-17: RESTORED to 1 loop task!  The 'varnames' lookup below never
# builds a var name via templating (it's a pure Jinja expression), so it works
# fine on ansible-core 2.19/2.20+ -- unlike "{{ item }}_install is defined".
# https://docs.ansible.com/ansible/latest/collections/ansible/builtin/varnames_lookup.html

- name: Assert that var dnsmasq_install is defined
  assert:
    that: dnsmasq_install is defined
    fail_msg: "VARIABLE MUST BE DEFINED: 'dnsmasq_install' NEEDS A PROPER (UNQUOTED) ANSIBLE BOOLEAN VALUE e.g. IN: /etc/iiab/local_vars.yml"
    quiet: yes

- name: "Assert that all {{ vars_checklist | length }} 'XYZ_install' vars are defined"
  assert:
    that: "lookup('varnames', '^' + item + '_install$') | length > 0"
    fail_msg: "VARIABLE MUST BE DEFINED: '{{ item }}_install' NEEDS A PROPER (UNQUOTED) ANSIBLE BOOLEAN VALUE e.g. IN: /etc/iiab/local_vars.yml"
    quiet: yes
  loop: "{{ vars_checklist }}"
