# 2025-09-15: These ~47 asserts were temporarily spelled out exhaustively, as
# ansible-core 2.19 banned var names derived from {{ }} string templating
# inside 'that:' conditionals -- see: https://github.com/iiab/iiab/issues/4030
#
# 2026-10-17: RESTORED to 1 loop task!  The 'vars' + 'varnames' lookups below
# never build var names via templating (they're pure Jinja expressions), so
# they work fine on ansible-core 2.19/2.20+.
# https://docs.ansible.com/ansible/latest/collections/ansible/builtin/varnames_lookup.html
# https://docs.ansible.com/ansible/latest/collections/ansible/builtin/vars_lookup.html

- name: 'DISALLOW "XYZ_install: False" WHEN "XYZ_installed is defined" IN /etc/iiab/iiab_state.yml ...for up-to-{{ vars_checklist | length }} var pairs'
  assert:
    that: "lookup('vars', item + '_install') or lookup('varnames', '^' + item + '_installed$') | length == 0"
    fail_msg: "DISALLOWED: '{{ item }}_install: False' (e.g. in /etc/iiab/local_vars.yml) WHEN '{{ item }}_installed' is defined (e.g. in /etc/iiab/iiab_state.yml) -- IIAB DOES NOT SUPPORT UNINSTALLS -- please verify those 2 files especially, and other places variables are defined?"
    quiet: yes
  when: item != 'mysql' and item != 'postgresql' and item != 'mongodb' and item != 'nodejs'    # Exclude auto-installed dependencies
  loop: "{{ vars_checklist }}"
