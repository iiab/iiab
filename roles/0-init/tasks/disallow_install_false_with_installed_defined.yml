# 2026-10-27: State markers are read with the 'installed' lookup, so this no
# longer depends on iiab_state.yml being loaded through vars_files.
#
# 2026-10-28: Report EVERY conflict in one message, and explain the supported
# ways out.  This used to say "IIAB DOES NOT SUPPORT UNINSTALLS", which is no
# longer true for roles that implement './runrole --uninstall', and gave the
# user no next step.

- name: Start with an empty installed/install conflict list
  set_fact:
    installed_conflicts: []

- name: 'Find installed apps that "*_install: False" would disable'
  set_fact:
    installed_conflicts: >-
      {{ installed_conflicts | default([]) + [item] }}
  # hostapd and dnsmasq are stub install vars without state markers.
  loop: "{{ vars_checklist | difference(['hostapd', 'dnsmasq']) }}"
  when:
    - not uninstall    # During --uninstall the marker must stay until cleanup finishes.
    - item != 'mysql' and item != 'postgresql' and item != 'mongodb' and item != 'nodejs'    # Exclude auto-installed dependencies
    - not lookup('vars', item + '_install')
    # admin_console is recorded by iiab-admin as iiab_admin_installed.
    - lookup('installed', ('iiab_admin_installed' if item == 'admin_console' else item))

- name: 'DISALLOW "XYZ_install: False" WHEN "XYZ_installed" IS TRUE IN /etc/iiab/iiab_state.yml ...for up-to-{{ vars_checklist | length }} var pairs'
  fail:
    msg: |
      DISALLOWED: {{ installed_conflicts | length }} app(s) are already installed,
      but /etc/iiab/local_vars.yml sets their '*_install' to False:

      {% for item in installed_conflicts %}
        - {{ var_role_names.get(item, item) }}  ({{ item }}_install: False in local_vars.yml, {{ 'iiab_admin_installed' if item == 'admin_console' else item ~ '_installed' }}: True in iiab_state.yml)
      {% endfor %}

      IIAB cannot turn an installed app off by changing local_vars.yml alone.
      Choose one:

      1. KEEP IT INSTALLED
         Set '<app>_install: True' in /etc/iiab/local_vars.yml and re-run.

      2. UNINSTALL IT FIRST (only for standalone roles that support this)
           ./runrole --list
           sudo ./runrole --uninstall <role>
         Then set '<app>_install: False' in /etc/iiab/local_vars.yml.
         Prefixes managed by a larger role have no standalone uninstall:
         squid belongs to 'network', and admin_console belongs to 'iiab-admin'.
         Remove those manually first, then use option 3.

      3. CLEAR A STALE MARKER (only if the app is already gone)
         If an earlier install failed after recording its marker, and you have
         since removed the program and its settings, clear the marker with:
           sudo ./scripts/iiab-state forget <state-prefix>
         Use the state-file prefix, not always the app name: admin_console uses
         iiab_admin, and calibre-web uses calibreweb.
         This makes IIAB treat the role as uninstalled.  Do not use it while
         the program or its settings are still present.

      Inspect without changing anything:
        ./runrole --status <role>
        ./runrole --list
        ./runrole --check-local-vars

      More help: http://FAQ.IIAB.IO
      https://github.com/iiab/iiab/wiki/IIAB-Installation#do-everything-from-scratch
  when: installed_conflicts | default([]) | length > 0
