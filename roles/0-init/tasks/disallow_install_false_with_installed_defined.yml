# 2026-10-27: State markers are read with the 'installed' lookup, so this no
# longer depends on iiab_state.yml being loaded through vars_files.
#
# 2026-10-28: Report EVERY conflict in one message, and explain the supported
# ways out.  This used to say "IIAB DOES NOT SUPPORT UNINSTALLS", which is no
# longer true for roles that implement './runrole --uninstall', and gave the
# user no next step.

- name: Start with an empty installed/install conflict list
  set_fact:
    installed_conflicts: []

- name: 'Find installed apps that "*_install: False" would disable'
  set_fact:
    installed_conflicts: >-
      {{ installed_conflicts | default([]) + [item] }}
  # hostapd/dnsmasq are stub install vars without state markers. nginx is a
  # shared, always-installed dependency with no standalone uninstall, so its
  # own role assertion owns that check.
  loop: "{{ vars_checklist | difference(['hostapd', 'dnsmasq', 'nginx']) }}"
  when:
    - not uninstall    # During --uninstall the marker must stay until cleanup finishes.
    - item != 'mysql' and item != 'postgresql' and item != 'mongodb' and item != 'nodejs'    # Exclude auto-installed dependencies
    - not lookup('vars', item + '_install')
    # admin_console is recorded by iiab-admin as iiab_admin_installed.
    - lookup('installed', ('iiab_admin_installed' if item == 'admin_console' else item))

- name: 'DISALLOW "XYZ_install: False" WHEN "XYZ_installed" IS TRUE IN /etc/iiab/iiab_state.yml ...for up-to-{{ vars_checklist | length }} var pairs'
  fail:
    msg: |
      DISALLOWED: {{ installed_conflicts | length }} installed app(s) have
      '<app>_install: False' in /etc/iiab/local_vars.yml:

      {% for item in installed_conflicts %}
        - {{ var_role_names.get(item, item) }}  ({{ item }}_install: False, {{ 'iiab_admin_installed' if item == 'admin_console' else item ~ '_installed' }}: True)
      {% endfor %}

      Choose one:
      1. Keep it: set '<app>_install: True' in local_vars.yml and re-run.
      2. Uninstall it (roles that support this):
           ./runrole --list
           sudo ./runrole --uninstall <role>
         Prefixes managed by a larger role (squid -> network, admin_console ->
         iiab-admin) have no standalone uninstall.
      3. If the program and its settings are already gone, clear the stale
         marker with the state-file prefix (admin_console -> iiab_admin,
         calibre-web -> calibreweb):
           sudo ./scripts/iiab-state forget <state-prefix>

      Inspect without changing anything:
        ./runrole --status <role>
        ./runrole --list

      More help: http://FAQ.IIAB.IO
      https://github.com/iiab/iiab/wiki/IIAB-Installation#do-everything-from-scratch
  when: installed_conflicts | default([]) | length > 0
