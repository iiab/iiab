---
# Install/update phase. The shared runner runs this on first install,
# --reinstall and --clean-install. --reinstall (or a fresh host) wipes and
# reclones the checkout. This is the only phase that may use the network.

# 1. INSTALL 2 PREREQS

- name: "Set 'nodejs_install: True' and 'nodejs_enabled: True'"
  set_fact:
    nodejs_install: True
    nodejs_enabled: True

- name: NODEJS - run 'nodejs' role (attempt to install & enable Node.js)
  include_role:
    name: nodejs

- name: Assert that 10.x <= nodejs_version ({{ nodejs_version }})
  assert:
    that: nodejs_version is version('10.x', '>=')
    fail_msg: "Internet Archive install cannot proceed, as it currently requires Node.js 10+, and your nodejs_version is set to {{ nodejs_version }}.  Please check the value of nodejs_version in /opt/iiab/iiab/vars/default_vars.yml and possibly also /etc/iiab/local_vars.yml"
    quiet: yes

- name: Install package 'libsecret-1-dev'
  package:
    name: libsecret-1-dev
    state: present


# 2. UPDATE AN EXISTING INSTALL IN PLACE

# 2020-02-11: @mitra42 & @holta agree (#2247) that the 2-stanza "UPDATE
# internetarchive" portion should run whenever one isn't installing (or
# reinstalling) internetarchive, for now.  The update branch refreshes an existing
# checkout when install.yml runs without --reinstall.
- name: "UPGRADE: Stop 'internetarchive' systemd service, if internetarchive_installed is defined"
  systemd:
    name: internetarchive
    daemon_reload: yes
    state: stopped
  when:
    - lookup('installed', 'internetarchive_installed')
    - not reinstall

- name: "UPGRADE: Run 'npm install && npm update' in {{ internetarchive_dir }}/dweb-mirror, if internetarchive_installed is defined"
  shell: npm install && npm update
  args:
    chdir: "{{ internetarchive_dir }}/dweb-mirror"
  when:
    - lookup('installed', 'internetarchive_installed')
    - not reinstall


# 3. INSTALL OR REBUILD FROM SCRATCH

- name: Install Internet Archive from scratch
  when: not lookup('installed', 'internetarchive_installed') or reinstall
  block:

    - name: mkdir {{ internetarchive_dir }}
      file:
        state: directory
        path: "{{ internetarchive_dir }}"    # /opt/iiab/internetarchive

    - name: Wipe dir {{ internetarchive_dir }}/dweb-mirror so './runrole --reinstall internetarchive' gets you the latest code
      file:
        state: absent
        path: "{{ internetarchive_dir }}/dweb-mirror"

    - name: Clone dweb-mirror from GitHub
      git:
        repo: https://github.com/internetarchive/dweb-mirror
        dest: "{{ internetarchive_dir }}/dweb-mirror"

    - name: Run 'npm install' to download/populate {{ internetarchive_dir }}/dweb-mirror/node_modules (CAN TAKE ~5 MINUTES)
      shell: npm install
      args:
        chdir: "{{ internetarchive_dir }}/dweb-mirror"

    - name: mkdir {{ content_base }}/archiveorg
      file:
        state: directory
        path: "{{ content_base }}/archiveorg"    # /library

    - name: "Install from template: /etc/systemd/system/internetarchive.service"
      template:
        src: internetarchive.service.j2
        dest: /etc/systemd/system/internetarchive.service
