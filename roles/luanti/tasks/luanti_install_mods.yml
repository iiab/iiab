- name: Check if mod already installed
  stat:
    path: "{{ luanti_game_dir }}/mods/{{ item.name }}"
  register: luanti_mod

- name: Download one Luanti mod
  get_url:
    url: "{{ item.url }}"
    dest: "{{ downloads_dir }}/{{ item.name }}.tar.gz"
    mode: "0440"
    timeout: "{{ download_timeout }}"
  when: not luanti_mod.stat.exists

- name: Create dir {{ luanti_game_dir }}/mods/{{ item.name }}
  file:
    state: directory
    path: "{{ luanti_game_dir }}/mods/{{ item.name }}"
  when: not luanti_mod.stat.exists

- name: Extract mod into {{ luanti_game_dir }}/mods/{{ item.name }}
  unarchive:
    src: "{{ downloads_dir }}/{{ item.name }}.tar.gz"
    dest: "{{ luanti_game_dir }}/mods/{{ item.name }}"
    extra_opts:
      - --strip-components=1    # Drop tarball's '<repo>-<commit>/' top-level dir
  when: not luanti_mod.stat.exists
