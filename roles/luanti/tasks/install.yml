- name: Check for Luanti world file ({{ luanti_world_dir }}/world.mt)
  stat:
    path: "{{ luanti_world_dir }}/world.mt"
  register: luanti_world

# Parent dirs auto-created in luanti_install.yml
# - name: mkdir /library/games
#   file:
#     state: directory
#     path: /library/games

- include_tasks: luanti_install.yml
  when: not luanti_world.stat.exists


# Install games
#- include_tasks: luanti_install_games.yml
#  with_items:
#    - name: carbone-ng
#      url: https://github.com/Calinou/carbone-ng

# "As of 5.8.0 [2023-12-04], Luanti no longer ships with a default game,
# meaning you will have to provide your own game to use with the server."
# https://docs.luanti.org/for-server-hosts/setup/#running-the-server

- name: Create dir {{ luanti_working_dir }}/games/    # e.g. /usr/share/luanti, formerly /usr/share/games/minetest
  file:
    state: directory
    path: "{{ luanti_working_dir }}/games/"

# Download the game from upstream GitHub (pinned tag) instead of ContentDB, so
# installs no longer depend on content.luanti.org being online -- e.g. it was
# down for days after the October 2026 security incident:
# https://blog.luanti.org/2026/10/27/contentdb-security-incident/

- name: Download default game https://github.com/luanti-org/minetest_game (TAG 5.8.0) -- if luanti_default_game == "minetest" AND (RasPiOS >= 13 or Debian >= 13 or Ubuntu >= 24.10)
  get_curl:
    url: https://github.com/luanti-org/minetest_game/archive/refs/tags/5.8.0.tar.gz
    dest: "{{ downloads_dir }}/game.tar.gz"
    timeout: "{{ download_timeout }}"
  register: luanti_game_dl
  when: luanti_default_game == "minetest" and ((is_raspbian and os_ver is version('raspbian-13', '>=')) or (is_debian and not is_raspbian and os_ver is version('debian-13', '>=')) or (is_ubuntu and os_ver is version('ubuntu-2410', '>=')))    # Gratuitous parens for clarity

- name: Create dir {{ luanti_game_dir }}    # i.e. {{ luanti_working_dir }}/games/minetest_game
  file:
    state: directory
    path: "{{ luanti_game_dir }}"
  when: luanti_default_game == "minetest" and ((is_raspbian and os_ver is version('raspbian-13', '>=')) or (is_debian and not is_raspbian and os_ver is version('debian-13', '>=')) or (is_ubuntu and os_ver is version('ubuntu-2410', '>=')))    # Gratuitous parens for clarity

- name: Unarchive luanti default game
  unarchive:
    src: "{{ luanti_game_dl.dest }}"
    dest: "{{ luanti_game_dir }}"
    extra_opts:
      - --strip-components=1    # Drop tarball's 'minetest_game-5.8.0/' top-level dir (gameid stays 'minetest_game')
  when: luanti_default_game == "minetest" and ((is_raspbian and os_ver is version('raspbian-13', '>=')) or (is_debian and not is_raspbian and os_ver is version('debian-13', '>=')) or (is_ubuntu and os_ver is version('ubuntu-2410', '>=')))    # Gratuitous parens for clarity
  #when: luanti_default_game == "minetest" and not luanti_server_renamed.failed


# The mods come from their canonical upstream GitHub repos, pinned to the
# commit hashes below, so installs do not depend on ContentDB being online
# (content.luanti.org was down for days after the October 2026 security
# incident). Bump a commit hash to update that mod.
# basic_materials and pipeworks are pinned to revisions compatible with Luanti 5.8.

- name: Install mods
  include_tasks: luanti_install_mods.yml
  with_items:
    - name: xcompat
      url: https://github.com/mt-mods/xcompat/archive/758684dac8875d06d8c1565e323ee52c9d4daf7f.tar.gz
    - name: fakelib
      url: https://github.com/OgelGames/fakelib/archive/562dc359f00227daf0ee56dbba9c36a240c59d4c.tar.gz
    - name: basic_materials
      url: https://github.com/mt-mods/basic_materials/archive/a2ba6572df37df19e6724ccabf0b6ed47dbe2969.tar.gz
    - name: mesecons    # mt-mods/mesecons is archived: minetest-mods/mesecons is the maintained one
      url: https://github.com/minetest-mods/mesecons/archive/b79962402b829e5ea939572cdc06ba149e9588a9.tar.gz
    - name: digilines
      url: https://github.com/minetest-mods/digilines/archive/3f6e553b7c7fe7017a96527b9cb26f367cb6f8b7.tar.gz
    - name: pipeworks
      url: https://github.com/mt-mods/pipeworks/archive/ef172d05565dd173b52e9c9e1bd713c34be3baea.tar.gz
    - name: worldedit    # ContentDB's 'sfan5/worldedit' packages this repo
      url: https://github.com/Uberi/Minetest-WorldEdit/archive/62ffafe3bcb386600c431ef3840d91c3c8f85639.tar.gz
  when: luanti_default_game == "minetest"
