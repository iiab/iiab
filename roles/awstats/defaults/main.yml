# awstats_install: True
# awstats_enabled: True

# All above are set in: github.com/iiab/iiab/blob/master/vars/default_vars.yml
# If nec, change them by editing /etc/iiab/local_vars.yml prior to installing!

awstats_data_dir: "{{ content_base }}/awstats/"    # /library/awstats

# Ownership declarations.  See "Data ownership" in the top-level README.md.
# User settings survive applies, and are reset by --reinstall (uninstall.yml)
# and --uninstall.  Program data may be rebuilt or removed.  User data is never
# deleted.
awstats_user_settings:
  - /etc/awstats/awstats.schoolserver.conf
awstats_program_data:
  - /etc/awstats/awstats.conf
  - /etc/awstats/awstats.conf.dist
  - /etc/nginx/cgi-bin.php
  - /usr/lib/cgi-bin/awstats
  - "{{ nginx_conf_dir }}/awstats-nginx.conf"
awstats_user_data:
  - "{{ awstats_data_dir }}"
