---
# Local preparation for --reinstall. Never fetches anything; install.yml and
# configure.yml rebuild what is removed. User data in {{ awstats_data_dir }}
# is never deleted. --clean-install runs uninstall.yml instead, which removes
# the program, its package, and its settings before install.yml runs again.

- name: Remove AWStats configuration for a reinstall
  file:
    path: "{{ item }}"
    state: absent
  with_items:
    - "{{ nginx_conf_dir }}/awstats-nginx.conf"
    - /etc/awstats/awstats.conf
    - /etc/awstats/awstats.schoolserver.conf
    - /usr/lib/cgi-bin/awstats/awstats.pl
  notify:
    - Reload nginx
