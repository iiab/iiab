---
# Install/update phase. The runner runs this on first install, --reinstall
# and --clean-install. install.yml is the only phase
# that installs or refreshes the program, so an ordinary apply never downloads
# anything unless the package is missing.
#
# Removing the generated configuration first is safe on every path: a fresh
# install has nothing to remove, --clean-install has already removed it in
# uninstall.yml, and --reinstall rebuilds it in configure.yml.  On reinstall
# the package is already present, so 'state: present' will not recreate these
# files behind our back.

- name: Remove generated AWStats configuration before rebuilding it
  file:
    path: "{{ item }}"
    state: absent
  with_items:
    - "{{ nginx_conf_dir }}/awstats-nginx.conf"
    - /etc/awstats/awstats.conf
    - /etc/awstats/awstats.schoolserver.conf
    - /usr/lib/cgi-bin/awstats/awstats.pl
  notify:
    - Reload nginx

- name: Install the awstats package
  package:
    name: awstats
    state: present

- name: Create 2 directories... mkdir {{ awstats_data_dir }} (intermediate summary storage) and /usr/lib/cgi-bin/awstats, recursively chown {{ apache_user }}:{{ apache_user }}, with chmod u+rw,g+r,g-w,o-rwx
  file:
    state: directory
    recurse: yes
    path: "{{ item }}"
    owner: "{{ apache_user }}"    # USED FOR NGINX TOO: 'www-data' on debuntu
    group: "{{ apache_user }}"
    mode: u+rw,g+r,g-w,o-rwx    # '0750' turned on too many x bits
  with_items:
    - "{{ awstats_data_dir }}"    # /library/awstats
    - /usr/lib/cgi-bin/awstats    # create backward compatible path for awstats
