---
# Install phase. The runner runs this on a first install and on --reinstall.
# This is the only phase that installs or refreshes the program, so an apply to
# an installed role never downloads anything.
#
# On --reinstall, uninstall.yml has already removed the program, program data,
# and user settings that the reinstall resets. This phase starts from a clean
# slate.

- name: Install the awstats package
  package:
    name: awstats
    state: present

- name: Create 2 directories... mkdir {{ awstats_data_dir }} (intermediate summary storage) and /usr/lib/cgi-bin/awstats, recursively chown {{ apache_user }}:{{ apache_user }}, with chmod u+rw,g+r,g-w,o-rwx
  file:
    state: directory
    recurse: yes
    path: "{{ item }}"
    owner: "{{ apache_user }}"    # USED FOR NGINX TOO: 'www-data' on debuntu
    group: "{{ apache_user }}"
    mode: u+rw,g+r,g-w,o-rwx    # '0750' turned on too many x bits
  with_items:
    - "{{ awstats_data_dir }}"    # /library/awstats
    - /usr/lib/cgi-bin/awstats    # create backward compatible path for awstats
