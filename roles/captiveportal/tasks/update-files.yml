- name: Install the Captive Portal NGINX default server
  template:
    src: capture.conf.j2
    dest: /etc/nginx/sites-available/capture.conf

- name: Ensure the dnsmasq configuration directory exists
  file:
    path: /etc/dnsmasq.d
    state: directory
    mode: '0755'

- name: Install the Captive Portal dnsmasq source configuration
  template:
    src: capture-dnsmasq.j2
    dest: /etc/iiab/captiveportal-dnsmasq
    mode: '0644'

- name: Copy the Captive Portal splash template into /opt/iiab/captiveportal/
  copy:
    src: simple.template
    dest: /opt/iiab/captiveportal/simple.template

- name: Remove the obsolete Captive Portal macOS splash template
  file:
    path: /opt/iiab/captiveportal/mac.template
    state: absent

- name: Remove the obsolete deployed Captive Portal probe list
  file:
    path: /opt/iiab/captiveportal/checkurls
    state: absent

- name: Update /opt/iiab/captiveportal/capture-wsgi.py with the current probe handlers
  template:
    src: capture-wsgi.py.j2
    dest: /opt/iiab/captiveportal/capture-wsgi.py
    mode: '0755'
  register: captiveportal_wsgi
