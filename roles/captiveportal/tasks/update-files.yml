- name: Update /opt/iiab/captiveportal/checkurls with the current probe hostnames
  template:
    src: checkurls
    dest: /opt/iiab/captiveportal/checkurls
    mode: '0644'

- name: Update /usr/sbin/iiab-make-cp-servers.py with the current captive portal paths
  template:
    src: iiab-make-cp-servers.py
    dest: /usr/sbin/iiab-make-cp-servers.py
    mode: '0755'

- name: Update /opt/iiab/captiveportal/capture-wsgi.py with the current probe handlers
  template:
    src: capture-wsgi.py.j2
    dest: /opt/iiab/captiveportal/capture-wsgi.py
    mode: '0755'
  register: captiveportal_wsgi

- name: Regenerate NGINX captive portal servers from the current checkurls
  command: /usr/sbin/iiab-make-cp-servers.py
