# 2020-01-22: Package 'uwsgi' is installed by nginx/tasks/install.yml for
# Captive Portal (responds to browsers trying to detect a Captive Portal) and
# also for Admin Console.

# The distro-provided uwsgi-app@.service and uwsgi-app@.socket run each
# application in its own systemd instance.

- name: Install /etc/uwsgi/apps-available/captiveportal.ini from template (if captiveportal_enabled)
  template:
    src: captiveportal.ini.j2
    dest: /etc/uwsgi/apps-available/captiveportal.ini
  register: captiveportal_ini
  when: captiveportal_enabled

- name: Delete Captive Portal configuration when not captiveportal_enabled
  file:
    path: /etc/uwsgi/apps-available/captiveportal.ini
    state: absent
  when: not captiveportal_enabled

- name: Symlink /etc/nginx/sites-enabled/capture.conf -> /etc/nginx/sites-available/capture.conf to enable NGINX to service the sites in checkurls list (if captiveportal_enabled)
  file:
    src: /etc/nginx/sites-available/capture.conf
    path: /etc/nginx/sites-enabled/capture.conf
    state: link
  when: captiveportal_enabled

- name: Delete symlink /etc/nginx/sites-enabled/capture.conf to disable NGINX to location definitions for checkurls (if not captiveportal_enabled)
  file:
    path: /etc/nginx/sites-enabled/capture.conf
    state: absent
  when: not captiveportal_enabled

- name: Install or update the Captive Portal NGINX and dnsmasq generator
  template:
    src: iiab-make-cp-servers.py
    dest: /usr/sbin/iiab-make-cp-servers.py
    mode: '0755'

- name: Remove the obsolete Captive Portal dnsmasq helper
  file:
    path: /usr/sbin/iiab-divert-to-nginx
    state: absent

- name: Install and update Captive Portal generated files
  include_tasks: update-files.yml
  when: captiveportal_enabled

- name: Generate NGINX captive portal servers and update dnsmasq diversion
  command: /usr/sbin/iiab-make-cp-servers.py

- name: Update NGINX files and restart NGINX
  include_role:
    name: nginx
    tasks_from: enable-or-disable

# Stop the service before its socket, matching the Admin Console's uWSGI
# ordering. This avoids stopping a socket out from under a still-running
# service (and the reverse when disabling both).
- name: Stop and disable Captive Portal uWSGI service when not captiveportal_enabled
  systemd_service:
    name: uwsgi-app@captiveportal.service
    enabled: false
    state: stopped
  when: not captiveportal_enabled

- name: Stop and disable Captive Portal uWSGI socket when not captiveportal_enabled
  systemd_service:
    name: uwsgi-app@captiveportal.socket
    enabled: false
    state: stopped
  when: not captiveportal_enabled

# This is an idempotent start, not a restart, so the running service can stay
# up. If a socket restart is ever needed (e.g. its drop-in changed), stop
# uwsgi-app@captiveportal.service first, as the Admin Console role does.
- name: Enable and start Captive Portal uWSGI socket when captiveportal_enabled
  systemd_service:
    name: uwsgi-app@captiveportal.socket
    daemon_reload: yes
    enabled: true
    state: started
  when: captiveportal_enabled

- name: Enable and start Captive Portal uWSGI service when captiveportal_enabled
  systemd_service:
    name: uwsgi-app@captiveportal.service
    enabled: true
    state: started
  when: captiveportal_enabled

- name: Restart Captive Portal uWSGI service when its application changes
  systemd_service:
    name: uwsgi-app@captiveportal.service
    state: restarted
  when:
    - captiveportal_enabled
    - (captiveportal_wsgi is defined and captiveportal_wsgi is changed) or (captiveportal_ini is defined and captiveportal_ini is changed)

# The network role normally regenerates the firewall by running
# /usr/bin/iiab-gen-iptables. A standalone './runrole captiveportal' does not
# run it, so this task regenerates the firewall as well.
# The generator is deployed before execution so the probe DNS
# (via iiab-make-cp-servers.py) and port-80 DNAT use matching rules. During
# installation, the network role runs last and the generator may be absent, so
# the stat guards below skip cleanly.
- name: Record whether /usr/bin/iiab-gen-iptables exists (installed by the network role)
  stat:
    path: /usr/bin/iiab-gen-iptables
  register: gen_iptables

- name: Install the current Captive Portal firewall generator before running it (full path needed)
  template:
    src: roles/network/templates/gateway/iiab-gen-iptables
    dest: /usr/bin/iiab-gen-iptables
    mode: "0755"
  when: gen_iptables.stat.exists

- name: Regenerate iptables firewall to match 'captiveportal_enabled' and 'iiab_gateway_enabled'
  command: /usr/bin/iiab-gen-iptables
  when: gen_iptables.stat.exists
