# 2020-01-22: Package 'uwsgi' is installed by nginx/tasks/install.yml for
# Captive Portal (responds to browsers trying to detect a Captive Portal) and
# also for Admin Console.

# The distro-provided uwsgi-app@.service runs this app as its own instance.
- name: Install /etc/uwsgi/apps-available/captiveportal.ini from template (if captiveportal_enabled)
  template:
    src: captiveportal.ini.j2
    dest: /etc/uwsgi/apps-available/captiveportal.ini
  when: captiveportal_enabled

- name: Delete Captive Portal configuration when not captiveportal_enabled
  file:
    path: /etc/uwsgi/apps-available/captiveportal.ini
    state: absent
  when: not captiveportal_enabled

- name: Symlink /etc/nginx/sites-enabled/capture.conf -> /etc/nginx/sites-available/capture.conf to enable NGINX to service the sites in checkurls list (if captiveportal_enabled)
  file:
    src: /etc/nginx/sites-available/capture.conf
    path: /etc/nginx/sites-enabled/capture.conf
    state: link
  when: captiveportal_enabled

- name: Delete symlink /etc/nginx/sites-enabled/capture.conf to disable NGINX to location definitions for checkurls (if not captiveportal_enabled)
  file:
    path: /etc/nginx/sites-enabled/capture.conf
    state: absent
  when: not captiveportal_enabled

- name: Run /usr/sbin/iiab-divert-to-nginx to generate diversion lists for NGINX
  command: /usr/sbin/iiab-divert-to-nginx
  when: captiveportal_enabled

- name: Delete /etc/dnsmasq.d/capture to make sure dnsmasq is not diverting (if not captiveportal_enabled)
  file:
    path: /etc/dnsmasq.d/capture
    state: absent
  when: not captiveportal_enabled

- name: Enable Captive Portal uWSGI app instance at boot
  file:
    src: "{{ systemd_location }}/uwsgi-app@.service"
    path: /etc/systemd/system/multi-user.target.wants/uwsgi-app@captiveportal.service
    state: link
  when:
    - captiveportal_enabled
    - not is_proot

- name: Disable Captive Portal uWSGI app instance at boot
  file:
    path: /etc/systemd/system/multi-user.target.wants/uwsgi-app@captiveportal.service
    state: absent
  when:
    - not captiveportal_enabled
    - not is_proot

- name: Start Captive Portal uWSGI app instance
  systemd_service:
    name: uwsgi-app@captiveportal.service
    daemon_reload: yes
    state: restarted
  when:
    - captiveportal_enabled
    - not is_proot

- name: Stop Captive Portal uWSGI app instance
  systemd_service:
    name: uwsgi-app@captiveportal.service
    state: stopped
  when:
    - not captiveportal_enabled
    - not is_proot

# Unify 2 stanzas below ('state: restarted') when we end Ubuntu 16.04 support.
- name: Stop 'dnsmasq' systemd service (if dnsmasq_enabled)
  systemd:
    name: dnsmasq
    state: stopped
  when:
    - dnsmasq_enabled
    - not is_proot

- name: Start 'dnsmasq' systemd service (if dnsmasq_enabled)
  systemd:
    name: dnsmasq
    state: started
  when:
    - dnsmasq_enabled
    - not is_proot
