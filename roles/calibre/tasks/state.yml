---
# Record the reported settings after a successful apply.

- name: Add 'calibre' variable values to {{ iiab_ini_file }}
  ini_file:
    path: "{{ iiab_ini_file }}"    # /etc/iiab/iiab.ini
    section: calibre
    option: "{{ item.option }}"
    value: "{{ item.value | string }}"
  with_items:
    - option: name
      value: Calibre
    - option: description
      value: '"Calibre is an extremely popular personal library system for e-books."'
    - option: calibre_src_url
      value: "{{ calibre_src_url }}"
    - option: calibre_dbpath
      value: "{{ calibre_dbpath }}"
    - option: calibre_port
      value: "{{ calibre_port }}"
    - option: calibre_enabled
      value: "{{ calibre_enabled }}"

- name: "Add 'calibre_installed: True' to {{ iiab_state_file }}"
  iiab_state:
    key: calibre_installed
