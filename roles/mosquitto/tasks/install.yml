- name: "Install packages: mosquitto, mosquitto-clients"
  package:
    name: "{{ item }}"
    state: present
  with_items:
    - mosquitto
    - mosquitto-clients

- name: Disable & Stop 'mosquitto' service
  systemd:
    name: mosquitto
    enabled: no
    state: stopped

# Password and websocket configuration are reconciled by configure.yml on
# every apply.
