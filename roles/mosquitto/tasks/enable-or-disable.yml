- name: Reload systemd manager before resetting failed 'mosquitto' service state
  command: systemctl daemon-reload
  changed_when: false
  when: mosquitto_enabled

- name: Check whether 'mosquitto' systemd service is loaded
  command: systemctl show mosquitto --property=LoadState --value
  register: mosquitto_load_state
  changed_when: false
  when: mosquitto_enabled

- name: Reset failed state before restarting 'mosquitto' systemd service
  command: systemctl reset-failed mosquitto
  changed_when: false
  when:
    - mosquitto_enabled
    - mosquitto_load_state.stdout == 'loaded'

- name: Enable & (Re)Start 'mosquitto' systemd service, if mosquitto_enabled
  systemd:
    daemon_reload: yes
    name: mosquitto
    enabled: yes
    state: restarted
  when: mosquitto_enabled

- name: Disable & Stop 'mosquitto' systemd service, if not mosquitto_enabled
  systemd:
    daemon_reload: yes
    name: mosquitto
    enabled: no
    state: stopped
  when: not mosquitto_enabled
