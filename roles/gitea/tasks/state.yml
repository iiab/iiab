---
# Record the reported settings after a successful apply.

- name: Add 'gitea' variable values to {{ iiab_ini_file }}
  ini_file:
    path: "{{ iiab_ini_file }}"    # /etc/iiab/iiab.ini
    section: gitea
    option: "{{ item.option }}"
    value: "{{ item.value | string }}"
  with_items:
    - option: name
      value: Gitea
    - option: description
      value: '"Gitea is like GitHub for more offline communities: Git with a cup of tea"'
    - option: gitea_install
      value: "{{ gitea_install }}"
    - option: gitea_enabled
      value: "{{ gitea_enabled }}"
    - option: gitea_run_directory
      value: "{{ gitea_run_directory }}"
    - option: gitea_url
      value: "{{ gitea_url }}"

- name: "Add 'gitea_installed: True' to {{ iiab_state_file }}"
  iiab_state:
    key: gitea_installed
