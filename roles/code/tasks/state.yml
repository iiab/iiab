---
# Record the reported settings after a successful apply.

- name: Add 'code' variable values to {{ iiab_ini_file }}
  ini_file:
    path: "{{ iiab_ini_file }}"    # /etc/iiab/iiab.ini
    section: code
    option: "{{ item.option }}"
    value: "{{ item.value | string }}"
  with_items:
    - option: name
      value: Code On The Go
    - option: description
      value: 'Code On The Go, local APK distribution site.'
    - option: code_install
      value: "{{ code_install }}"
    - option: code_enabled
      value: "{{ code_enabled }}"

- name: "Add 'code_installed: True' to {{ iiab_state_file }}"
  iiab_state:
    key: code_installed
