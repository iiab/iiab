---
# Reconcile the supervisor service, then NGINX.

- name: Do a 'systemctl daemon-reload'
  systemd:
    daemon_reload: yes
  when: lokole_enabled

- name: Enable & Restart supervisor systemd service, if lokole_enabled
  systemd:
    name: supervisor
    enabled: yes
    state: restarted
  when: lokole_enabled

- name: Disable & Stop supervisor systemd service, if not lokole_enabled
  systemd:
    name: supervisor
    enabled: no
    state: stopped
  when: not lokole_enabled

- name: Enable/Disable/Restart NGINX
  include_tasks: nginx.yml
