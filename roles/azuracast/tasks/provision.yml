---
# Provision AzuraCast without its web UI, from the declarations in
# azuracast_stations (see vars/default_vars.yml).
#
# Safe to re-run: stations and playlists are matched by name, and the demo
# objects created by AzuraCast's fixture bootstrap are removed.

- name: Check for AzuraCast's API key
  stat:
    path: "{{ azuracast_api_key_file }}"
  register: _ac_key_file

- name: Provision AzuraCast (stations and playlists)
  include_tasks: provision-stations.yml
  when: _ac_key_file.stat.exists

- name: Warn when AzuraCast provisioning is skipped
  debug:
    msg: >-
      No API key at {{ azuracast_api_key_file }}, so IIAB skipped AzuraCast
      provisioning.  Create an API key in AzuraCast's web UI
      (My Account -> API Keys), save it to that file, then re-run:
      ./runrole azuracast
  when: not _ac_key_file.stat.exists
