---
# Reconcile AzuraCast's environment files on every apply.  The Docker
# installer itself runs only in install.yml (first install, --clean-install),
# because it is not safe or useful to re-run it on a plain apply.

- name: AzuraCast - Make config directory {{ azuracast_host_dir }}
  file:
    path: "{{ azuracast_host_dir }}"    # /opt/azuracast
    state: directory

- name: AzuraCast - Install {{ azuracast_host_dir }}/.env from template
  template:
    src: prod.env.j2
    dest: "{{ azuracast_host_dir }}/.env"

- name: AzuraCast - Install {{ azuracast_host_dir }}/azuracast.env for altered ports
  template:
    src: azuracast.env.j2
    dest: "{{ azuracast_host_dir }}/azuracast.env"
