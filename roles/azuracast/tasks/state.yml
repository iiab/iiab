---
# Record the reported settings after a successful apply.

- name: Add 'azuracast' variable values to {{ iiab_ini_file }}
  ini_file:
    path: "{{ iiab_ini_file }}"    # /etc/iiab/iiab.ini
    section: azuracast
    option: "{{ item.option }}"
    value: "{{ item.value | string }}"
  with_items:
    - option: name
      value: azuracast
    - option: description
      value: '"AzuraCast is simple, self-hosted web radio.  Use it to schedule student newscasts, podcasts, music (e.g. MP3''s and similar) and even do live-streaming."'
    - option: enabled
      value: "{{ azuracast_enabled }}"

- name: "Add 'azuracast_installed: True' to {{ iiab_state_file }}"
  iiab_state:
    key: azuracast_installed
