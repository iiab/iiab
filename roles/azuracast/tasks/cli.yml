# Run AzuraCast's CLI inside its Docker container, non-interactively.
#
# 'docker.sh cli' allocates a TTY, which Ansible does not have, so IIAB uses
# its own wrapper (same command, plus '-T') for bootstrap and health checks.

- name: Install /usr/local/bin/iiab-azuracast-cli
  template:
    src: iiab-azuracast-cli.j2
    dest: /usr/local/bin/iiab-azuracast-cli
    owner: root
    group: root
    mode: '0755'
