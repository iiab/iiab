---
# Keeps AzuraCast alive without an IT helper: checks the web app, restarts the
# container or the stations when needed, and publishes /radio/status.json for
# the listener page.

- name: Install /usr/local/bin/iiab-radio-healthcheck
  template:
    src: iiab-radio-healthcheck.sh.j2
    dest: /usr/local/bin/iiab-radio-healthcheck
    owner: root
    group: root
    mode: '0755'

- name: Install systemd service for the radio health check
  template:
    src: iiab-radio-healthcheck.service.j2
    dest: /etc/systemd/system/iiab-radio-healthcheck.service
    owner: root
    group: root
    mode: '0644'

- name: Install systemd timer for the radio health check
  template:
    src: iiab-radio-healthcheck.timer.j2
    dest: /etc/systemd/system/iiab-radio-healthcheck.timer
    owner: root
    group: root
    mode: '0644'

- name: Enable & start the radio health-check timer
  systemd:
    name: iiab-radio-healthcheck.timer
    daemon_reload: yes
    enabled: yes
    state: started

- name: Run the radio health check once
  command: /usr/local/bin/iiab-radio-healthcheck
  changed_when: false
