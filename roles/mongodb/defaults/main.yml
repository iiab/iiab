# MongoDB (/library/dbdata/mongodb) greatly enhances the Sugarizer experience.
# The roles/mongodb playbook (was?) invoked by roles/sugarizer/meta/main.yml

# 2020-01-23: mongodb_install is completely ignored as MongoDB is installed on
# demand as a dependency -- by Sugarizer -- but for now we set fake value
# 'mongodb_install: True' for 'mongodb_installed is defined' tests e.g. in
# 0-init/tasks/validate_vars.yml

# mongodb_install: True

# FYI 'mongodb_enabled: False' works when Sugarizer is disabled.  Required by
# mongodb/tasks/enable.yml to shut down the service and log status, but that is
# misleading as Sugarizer starts mongodb's systemd service on its own, due to
# 'Requires=mongodb.service' within /etc/systemd/system/sugarizer.service

# mongodb_enabled: False

# mongodb_port: 27017

# All above are set in: github.com/iiab/iiab/blob/master/vars/default_vars.yml
# If nec, change them by editing /etc/iiab/local_vars.yml prior to installing!

# Bump mongodb_default_version when MongoDB ships its next LTS.
mongodb_default_version: "9.0"

# All arm64 stays on 5.0; bump mongodb_arm_version to 9.0 for ARMv8.2-A boards (e.g. Pi 5).
mongodb_arm_version: "5.0"
# Pi 4 and older (ARMv8-A) need andyfelong.com's 5.0.5 overlay.
mongodb_arm_old_version: "5.0"
mongodb_board: "{{ rpi_model ~ ' ' ~ devicetree_model }}"
mongodb_rpi_old: "{{ mongodb_board is search('Raspberry Pi (1|2|3|4|400|Zero)') or mongodb_board is search('Compute Module (1|2|3|4)') }}"
mongodb_version: "{{ 'unsupported' if ansible_facts.machine not in ['x86_64', 'aarch64'] else mongodb_arm_old_version if ansible_facts.machine == 'aarch64' and mongodb_rpi_old | bool else mongodb_arm_version if ansible_facts.machine == 'aarch64' else mongodb_default_version }}"

# Ubuntu release behind an Ubuntu derivative, e.g. linuxmint-22 -> ubuntu-2404.
mongodb_ubuntu_ver: "{{ os_ver if is_debian or os_ver.startswith('ubuntu-') else 'ubuntu-2404' if (is_linuxmint and os_ver is version('linuxmint-22', '>=') and os_ver is version('linuxmint-27', '<')) or (is_trisquel and os_ver is version('trisquel-12', '>=') and os_ver is version('trisquel-13', '<')) else 'ubuntu-2604' }}"

# MongoDB's Debian archive has no arm64 server packages, so arm64 Debian uses the Ubuntu one.
mongodb_use_debian_repo: "{{ is_debian and dpkg_arch.stdout == 'amd64' and mongodb_version is version('8.0', '>=') }}"
mongodb_debian_major: "{{ ansible_facts.distribution_major_version }}"
mongodb_repo_uri: "{{ 'https://repo.mongodb.org/apt/debian' if mongodb_use_debian_repo | bool else 'https://repo.mongodb.org/apt/ubuntu' }}"
mongodb_repo_component: "{{ 'main' if mongodb_use_debian_repo | bool else 'multiverse' }}"
mongodb_repo_suite_ubuntu: "{{ 'focal' if dpkg_arch.stdout == 'arm64' and mongodb_version is version('6.0', '<') else 'noble' if is_debian and mongodb_debian_major is version('13', '>=') else 'resolute' if mongodb_ubuntu_ver is version('ubuntu-2604', '>=') else 'noble' if mongodb_ubuntu_ver is version('ubuntu-2404', '>=') else 'jammy' }}"
mongodb_repo_suite_debian: "{{ 'trixie' if mongodb_debian_major is version('13', '>=') else 'bookworm' }}"
mongodb_repo_suite: "{{ mongodb_repo_suite_debian if mongodb_use_debian_repo | bool else mongodb_repo_suite_ubuntu }}"

# MongoDB 9+ publishes server-9.asc, the 8.x line (incl. 8.2/8.3) server-8.0.asc,
# and earlier releases server-X.Y.asc.
mongodb_key_series: "{{ mongodb_version.split('.')[0] if mongodb_version is version('9.0', '>=') else '8.0' if mongodb_version is version('8.0', '>=') else mongodb_version }}"
mongodb_key_url: "https://pgp.mongodb.com/server-{{ mongodb_key_series }}.asc"
mongodb_keyring: /etc/apt/keyrings/mongodb-{{ mongodb_version }}.asc

# Immutable Debian security snapshot used for MongoDB 5.0's libssl1.1 dependency.
mongodb_debian_security_snapshot: "20260615T025018Z"

# VERIFY both X.Y versions exist (+ work!) below:
#
# 1) https://www.mongodb.org/static/pgp/server-X.Y.asc ~= https://pgp.mongodb.com
# 2) http://repo.mongodb.org/apt/debian &/OR https://repo.mongodb.org/apt/ubuntu

mongodb_conf: /etc/mongod.conf
mongodb_db_path: "{{ content_base }}/dbdata/mongodb"    # /library/dbdata/mongodb
mongodb_db_lock_file: "{{ mongodb_db_path }}/mongod.lock"
