# MongoDB (/library/dbdata/mongodb) greatly enhances the Sugarizer experience.
# The roles/mongodb playbook (was?) invoked by roles/sugarizer/meta/main.yml

# 2020-01-23: mongodb_install is completely ignored as MongoDB is installed on
# demand as a dependency -- by Sugarizer -- but for now we set fake value
# 'mongodb_install: True' for 'mongodb_installed is defined' tests e.g. in
# 0-init/tasks/validate_vars.yml

# mongodb_install: True

# FYI 'mongodb_enabled: False' works when Sugarizer is disabled.  Required by
# mongodb/tasks/enable.yml to shut down the service and log status, but that is
# misleading as Sugarizer starts mongodb's systemd service on its own, due to
# 'Requires=mongodb.service' within /etc/systemd/system/sugarizer.service

# mongodb_enabled: False

# mongodb_port: 27017

# All above are set in: github.com/iiab/iiab/blob/master/vars/default_vars.yml
# If nec, change them by editing /etc/iiab/local_vars.yml prior to installing!

# 9.0 is MongoDB's current LTS and the x86_64 default.  9.1/9.2/... are
# short-lived rapid releases, so IIAB stays on the LTS and bumps this one line
# when the next LTS ships.
mongodb_default_version: "9.0"

# All arm64 keeps 5.0, the last MongoDB IIAB can run on every board: 5.0+
# binaries are compiled for ARMv8.2-A, so 6.0+ fail on Raspberry Pi 4 and older
# (ARMv8-A), whereas IIAB overlays andyfelong.com's 5.0.5 binaries on Raspberry
# Pi hardware.  MongoDB 9.0 is opt-in on ARMv8.2-A hardware (e.g. Raspberry Pi
# 5) by setting 'mongodb_arm_version: "9.0"' in /etc/iiab/local_vars.yml.
mongodb_arm_version: "5.0"
mongodb_version: "{{ 'unsupported' if ansible_facts.machine not in ['x86_64', 'aarch64'] else mongodb_arm_version if ansible_facts.machine == 'aarch64' else mongodb_default_version }}"

# CAVEAT: image builds set rpi_model to 'fake' (roles/0-init/tasks/main.yml), so
# the Raspberry Pi 5.0.5 overlay cannot identify the target board while an
# image is built.  Any image that enables MongoDB therefore installs
# mongodb.org's 5.0 packages, which need ARMv8.2-A.  Only tiny/small images are
# published, and those disable Sugarizer, so no released image carries MongoDB.

# MongoDB's official packages are not in the Ubuntu/Debian archives, so the
# role adds MongoDB's own apt repository.  Debian 13 / Ubuntu 24.04 & 26.04
# are supported by MongoDB 9.0.  (Ubuntu 26.10 uses MongoDB's 26.04 "resolute"
# suite; interim Ubuntu releases use the previous LTS suite.)

# MongoDB's Debian archive carries server packages for amd64 only (arm64 there
# has client tools like mongosh/atlas-cli, but no mongodb-org).  Debian-family
# arm64 boards that opt into 9.0 -- notably Raspberry Pi 5 on Raspberry Pi OS
# 13 -- therefore use MongoDB's Ubuntu archive, whose noble suite tracks
# Debian 13 closely enough (both have libc6 >= 2.39 and the t64
# libssl3t64/libcurl4t64).
mongodb_use_debian_repo: "{{ is_debian and dpkg_arch.stdout == 'amd64' and mongodb_version is version('8.0', '>=') }}"

# Debian-family major version, e.g. '13' for Debian 13 and Raspberry Pi OS 13.
# This cannot come from os_ver: those strings start with a distribution name,
# so comparing them compares the names first ('raspbian-12' > 'debian-13').
mongodb_debian_major: "{{ ansible_facts.distribution_major_version }}"

mongodb_repo_uri: "{{ 'https://repo.mongodb.org/apt/debian' if mongodb_use_debian_repo | bool else 'https://repo.mongodb.org/apt/ubuntu' }}"
mongodb_repo_component: "{{ 'main' if mongodb_use_debian_repo | bool else 'multiverse' }}"
# ubuntu_ver (roles/0-init) resolves Ubuntu derivatives to the Ubuntu release
# they derive from, e.g. linuxmint-27 -> ubuntu-2604: that is what these suites
# track, since 'linuxmint-27' itself sorts below every 'ubuntu-*'.
mongodb_repo_suite_ubuntu: "{{ 'focal' if dpkg_arch.stdout == 'arm64' and mongodb_version is version('6.0', '<') else 'noble' if is_debian and mongodb_debian_major is version('13', '>=') else 'resolute' if ubuntu_ver is version('ubuntu-2604', '>=') else 'noble' if ubuntu_ver is version('ubuntu-2404', '>=') else 'jammy' }}"
mongodb_repo_suite_debian: "{{ 'trixie' if mongodb_debian_major is version('13', '>=') else 'bookworm' }}"
mongodb_repo_suite: "{{ mongodb_repo_suite_debian if mongodb_use_debian_repo | bool else mongodb_repo_suite_ubuntu }}"

# MongoDB 9+ publishes its key as server-9.asc (not server-9.0.asc).
mongodb_key_url: "https://pgp.mongodb.com/server-{{ mongodb_version.split('.')[0] if mongodb_version is version('9.0', '>=') else mongodb_version }}.asc"

# Versioning the key file lets `get_url` stay idempotent: a key that is already
# present is not re-downloaded on every role run, so re-running IIAB on an
# offline deployment keeps working.  The key is removed again with the source on
# Debian < 8.0 (see install.yml).
mongodb_keyring: /etc/apt/keyrings/mongodb-{{ mongodb_version }}.asc

# Immutable Debian security snapshot used for MongoDB 5.0's libssl1.1 dependency.
mongodb_debian_security_snapshot: "20260615T025018Z"

# VERIFY both X.Y versions exist (+ work!) below:
#
# 1) https://www.mongodb.org/static/pgp/server-X.Y.asc ~= https://pgp.mongodb.com
# 2) http://repo.mongodb.org/apt/debian &/OR https://repo.mongodb.org/apt/ubuntu

mongodb_conf: /etc/mongod.conf
mongodb_db_path: "{{ content_base }}/dbdata/mongodb"    # /library/dbdata/mongodb
mongodb_db_lock_file: "{{ mongodb_db_path }}/mongod.lock"
