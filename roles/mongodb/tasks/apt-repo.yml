# MongoDB's signing key and apt source are configuration, not install-only
# setup.  install.yml includes this on first install and main.yml includes it
# on later runs, so existing deployments do not keep an obsolete key/suite
# (e.g. https://github.com/iiab/iiab/issues/4582).
#
# This deliberately refreshes only apt metadata.  It never installs or
# upgrades MongoDB packages, so an existing major version is not migrated
# implicitly (hold.yml keeps apt from crossing majors on its own).
#
# The key file is versioned (mongodb_keyring), so a key that is already present
# is not downloaded again: re-running the role is idempotent, and works without
# network once the key exists.

- name: Add MongoDB {{ mongodb_version }} signing key
  get_url:
    url: "{{ mongodb_key_url }}"
    dest: "{{ mongodb_keyring }}"
    mode: '0644'

- name: Remove stale apt .list
  file:
    path: /etc/apt/sources.list.d/repo_mongodb_org_apt_ubuntu.list
    state: absent

- name: Add MongoDB {{ mongodb_version }} apt repository
  template:
    src: mongodb.sources.j2
    dest: /etc/apt/sources.list.d/mongodb_ubuntu.sources

# Only referenced by the source written just above, so removing it cannot
# leave apt pointing at a missing key.
- name: Remove the unversioned MongoDB key written by earlier IIAB releases
  file:
    path: /etc/apt/keyrings/mongodb.asc
    state: absent
