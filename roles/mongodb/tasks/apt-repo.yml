# Also refreshes existing installs; never installs or upgrades packages (see hold.yml).

- name: Add MongoDB {{ mongodb_version }} signing key
  get_url:
    url: "{{ mongodb_key_url }}"
    dest: "{{ mongodb_keyring }}"
    mode: '0644'

- name: Remove stale apt .list
  file:
    path: /etc/apt/sources.list.d/repo_mongodb_org_apt_ubuntu.list
    state: absent

- name: Add MongoDB {{ mongodb_version }} apt repository
  template:
    src: mongodb.sources.j2
    dest: /etc/apt/sources.list.d/mongodb_ubuntu.sources

- name: Remove the unversioned MongoDB keys written by earlier IIAB releases
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/keyrings/mongodb.asc
    - /etc/apt/keyrings/mongodb.gpg
