# MongoDB only supports upgrading to the next major, so keep apt from crossing majors.

- name: Hold MongoDB packages if the default major differs from the installed one
  when:
    - mongodb_installed_version.stdout | length > 0
    - mongodb_installed_version.stdout is version(mongodb_version, '<')
  block:

    - name: Read the names of the installed MongoDB packages
      command: dpkg-query -W -f='${binary:Package}\n' 'mongodb-org*'
      register: mongodb_packages
      changed_when: false
      failed_when: false

    - name: Read the packages apt currently holds
      command: apt-mark showhold
      register: mongodb_holds
      changed_when: false

    - name: Hold MongoDB packages so apt cannot upgrade across major versions
      command: apt-mark hold {{ item }}
      loop: "{{ mongodb_packages.stdout_lines }}"
      when: item not in mongodb_holds.stdout_lines
