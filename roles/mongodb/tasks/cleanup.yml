# MongoDB < 8.0 publishes SHA-1-signed repositories, which modern apt rejects.

- name: Remove the MongoDB < 8.0 apt source, key and SHA-1 workaround
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/mongodb_ubuntu.sources
    - /etc/apt/sources.list.d/repo_mongodb_org_apt_ubuntu.list
    - "{{ mongodb_keyring }}"
    - /etc/apt/keyrings/mongodb.asc
    - /etc/apt/keyrings/mongodb.gpg
    - /etc/crypto-policies/back-ends/apt-sequoia.config
  register: mongodb_cleanup

- name: Update the APT cache after removing the MongoDB < 8.0 source
  apt:
    update_cache: true
  when: mongodb_cleanup is changed
