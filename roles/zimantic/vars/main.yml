---
# Derived values for the zimantic role. These are evaluated lazily, so they can
# use gathered facts and values from /etc/iiab/local_vars.yml. Keep
# user-overridable settings in defaults/main.yml instead of here.

zimantic_version_is_latest: "{{ (zimantic_version | string) in ['latest', 'HEAD'] }}"

# Zimantic's native dependencies publish wheels for 64-bit x86_64 and aarch64
# only. Debian 13 carries python-libzim 3.6, which is older than the 4.1 Python
# API Zimantic now requires, and PyPI has no libzim 4.1 wheel for armhf/armv7.
zimantic_supported_machines:
  - aarch64
  - x86_64

zimantic_supported_models:
  - static-similarity-mrl-multilingual-v1
  - multilingual-e5-small
  - multilingual-e5-base
  - multilingual-e5-large
  - e5-small-v2
  - e5-base-v2
  - e5-large-v2

# PRoot runs as root and pdsm has no user switching, so the role does not
# create the 'zimantic' account there. Data and configuration stay owned by
# the account that runs the service.
zimantic_service_user: "{{ 'root' if is_proot else zimantic_user }}"

# Sourced by proot_services' pdsm wrapper (/usr/local/pdsm/services-available/
# zimantic). It carries the paths and mode, which pdsm cannot take from a unit.
zimantic_pdsm_env_file: /etc/default/zimantic

# A full 40-character (or abbreviated) commit hash may not be the tip of a
# branch, so a depth-1 clone cannot always check it out.
zimantic_version_is_commit: >-
  {{ (zimantic_version | string) is search('^[0-9a-f]{7,40}$') }}
