---
# Derived values for the zimantic role. These are evaluated lazily, so they can
# use gathered facts and values from /etc/iiab/local_vars.yml. Keep
# user-overridable settings in defaults/main.yml instead of here.

zimantic_system_packages_enabled: >-
  {{ zimantic_use_system_packages == 'always' or
     (zimantic_use_system_packages == 'auto' and
      (ansible_facts.machine | default('')) not in ['aarch64', 'x86_64']) }}

# Zimantic chooses SentencePiece when both tokenizer files are present, which
# is wrong for the English model. Remove whichever tokenizer the selected model
# does not use.
zimantic_unused_tokenizer_files: >-
  {{ ['sentencepiece.bpe.model', 'vocab.txt']
     | reject('equalto', zimantic_tokenizer_file) | list }}

# A full 40-character (or abbreviated) commit hash may not be the tip of a
# branch, so a depth-1 clone cannot always check it out.
zimantic_version_is_commit: >-
  {{ (zimantic_version | string) is search('^[0-9a-f]{7,40}$') }}
