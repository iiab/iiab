---
- name: Reload systemd
  systemd:
    daemon_reload: yes
  when: not is_proot

- name: Restart Zimantic via systemd
  systemd:
    name: zimantic
    state: restarted
  when:
    - zimantic_enabled
    - not is_proot
  listen: Restart Zimantic

- name: Restart Zimantic via pdsm
  command: pdsm restart zimantic
  when:
    - zimantic_enabled
    - is_proot
  listen: Restart Zimantic

- name: Restart nginx
  systemd:
    name: nginx
    state: restarted
  when: not is_proot

- name: Restart nginx via pdsm
  command: pdsm restart nginx
  when: is_proot
