# "How do i fail a task in Ansible if the variable contains a boolean value?
# I want to perform input validation for Ansible playbooks"

# ./runrole --uninstall zimantic removes the role instead of applying it, so
# skip the install-time validation and end the role once cleanup is done.
- name: Uninstall Zimantic
  include_tasks: uninstall.yml
  when: uninstall

- name: Stop processing Zimantic after uninstall
  meta: end_role
  when: uninstall

- name: Assert that "zimantic_install is sameas true" (boolean not string etc)
  assert:
    that: zimantic_install is sameas true
    fail_msg: "PLEASE SET 'zimantic_install: True' e.g. IN: /etc/iiab/local_vars.yml"
    quiet: yes

- name: Assert that "zimantic_enabled | type_debug == 'bool'" (boolean not string etc)
  assert:
    that: zimantic_enabled | type_debug == 'bool'
    fail_msg: "PLEASE GIVE VARIABLE 'zimantic_enabled' A PROPER (UNQUOTED) ANSIBLE BOOLEAN VALUE e.g. IN: /etc/iiab/local_vars.yml"
    quiet: yes

- name: Assert that "zimantic_mode" is supported
  assert:
    that: zimantic_mode in ['fast', 'semantic']
    fail_msg: "zimantic_mode must be either 'fast' or 'semantic'"
    quiet: yes

- name: Assert that "zimantic_file_types" is a non-empty list of patterns
  assert:
    that:
      - zimantic_file_types | type_debug == 'list'
      - zimantic_file_types | length > 0
      - zimantic_file_types | reject('string') | list | length == 0
    fail_msg: "zimantic_file_types must be a non-empty list of file types or glob patterns, for example [zim, text, ebook]"
    quiet: yes

- name: Assert that "zimantic_file_helpers" is supported
  assert:
    that: zimantic_file_helpers in ['auto', 'always', 'never']
    fail_msg: "zimantic_file_helpers must be 'auto', 'always', or 'never'"
    quiet: yes

- name: Assert that ordinary-file extraction settings are valid
  assert:
    that:
      - zimantic_file_timeout | float > 0
      - zimantic_max_file_text_chars | int > 0
      - zimantic_archive_depth | int >= 0
      - zimantic_max_archive_members | int > 0
      - zimantic_max_archive_bytes | int > 0
      - zimantic_max_ocr_pages | int >= 0
      - zimantic_ocr | type_debug == 'bool'
      - zimantic_ocr_languages is string
      - zimantic_ocr_languages | length > 0
      - zimantic_asr | type_debug == 'bool'
      - zimantic_asr_model is string
      - zimantic_asr_model | length > 0
    fail_msg: "Check the zimantic_file_* extraction limits and the OCR/ASR settings in local_vars.yml"
    quiet: yes

- block:

    - name: Fail on unsupported PRoot/Android environment
      fail:
        msg: "The Zimantic role currently requires regular systemd; PRoot/Android is not supported"
      when: is_proot

    - name: Validate zimantic_use_system_packages
      assert:
        that: zimantic_use_system_packages in ['auto', 'always', 'never']
        fail_msg: "zimantic_use_system_packages must be 'auto', 'always', or 'never'"
        quiet: yes

    - name: Determine whether to use distribution packages
      set_fact:
        zimantic_system_packages_enabled: >-
          {{ zimantic_use_system_packages == 'always' or
             (zimantic_use_system_packages == 'auto' and
              ansible_facts.machine not in ['aarch64', 'x86_64']) }}

    - name: Validate zimantic_embedding_model
      assert:
        that: zimantic_embedding_model in ['auto', 'multilingual-e5-small', 'e5-small-v2']
        fail_msg: "zimantic_embedding_model must be 'auto', 'multilingual-e5-small', or 'e5-small-v2'"
        quiet: yes

    - name: Determine which embedding model to use
      set_fact:
        zimantic_embedding_model_selected: >-
          {{ 'e5-small-v2' if (zimantic_embedding_model == 'auto' and
                               (ansible_facts.memtotal_mb | default(2048) | int) <= 1024)
             else (zimantic_embedding_model if zimantic_embedding_model != 'auto'
                   else 'multilingual-e5-small') }}

    - name: Select embedding model files
      set_fact:
        zimantic_selected_model_url: "{{ zimantic_english_model_url if zimantic_embedding_model_selected == 'e5-small-v2' else zimantic_multilingual_model_url }}"
        zimantic_selected_model_checksum: "{{ zimantic_english_model_checksum if zimantic_embedding_model_selected == 'e5-small-v2' else zimantic_multilingual_model_checksum }}"
        zimantic_selected_tokenizer_file: "{{ zimantic_english_tokenizer_file if zimantic_embedding_model_selected == 'e5-small-v2' else zimantic_multilingual_tokenizer_file }}"
        zimantic_selected_tokenizer_url: "{{ zimantic_english_tokenizer_url if zimantic_embedding_model_selected == 'e5-small-v2' else zimantic_multilingual_tokenizer_url }}"
        zimantic_selected_tokenizer_checksum: "{{ zimantic_english_tokenizer_checksum if zimantic_embedding_model_selected == 'e5-small-v2' else zimantic_multilingual_tokenizer_checksum }}"
        zimantic_unused_tokenizer_file: "{{ zimantic_multilingual_tokenizer_file if zimantic_embedding_model_selected == 'e5-small-v2' else zimantic_english_tokenizer_file }}"

    - name: Check for a supported Python version
      command: "{{ zimantic_python }} --version"
      register: zimantic_python_check
      changed_when: false
      failed_when: false

    - name: Fail if a supported Python version is unavailable
      fail:
        msg: "Zimantic currently requires Python 3.11-3.14; install a compatible {{ zimantic_python }} before enabling the zimantic role"
      when:
        - zimantic_python_check.rc != 0 or
          ((zimantic_python_check.stdout ~ zimantic_python_check.stderr) is not search('Python 3\\.(1[1-4])\\.'))

    # Reinstall clears the installed-state marker, so prepare the checkout
    # before deciding whether the installation tasks must run.
    - name: Prepare an existing Zimantic install for reinstall
      include_tasks: reinstall.yml
      when: reinstall or force_reinstall

    - name: Determine whether Zimantic needs installation or upgrade
      set_fact:
        zimantic_needs_install: >-
          {{ (not (zimantic_installed | default(false) | bool)) or
             ((zimantic_installed_version | default('')) != zimantic_version) or
             reinstall or
             upgrade or
             zimantic_source_update.changed is defined or
             zimantic_source_reset.changed is defined }}

    - name: Install or upgrade Zimantic
      include_tasks: install.yml
      when: zimantic_needs_install

    - include_tasks: enable-or-disable.yml

    - name: Add 'zimantic' variable values to {{ iiab_ini_file }}
      ini_file:
        path: "{{ iiab_ini_file }}"
        section: zimantic
        option: "{{ item.option }}"
        value: "{{ item.value | string }}"
      with_items:
        - option: name
          value: Zimantic
        - option: description
          value: '"Meaning-based and full-text search for local Kiwix ZIM files and documents."'
        - option: zimantic_install
          value: "{{ zimantic_install }}"
        - option: zimantic_enabled
          value: "{{ zimantic_enabled }}"
        - option: zimantic_mode
          value: "{{ zimantic_mode }}"
        - option: zimantic_embedding_model
          value: "{{ zimantic_embedding_model_selected }}"
        - option: zimantic_version
          value: "{{ zimantic_version }}"
        - option: zimantic_url
          value: "{{ zimantic_url }}"
        - option: zimantic_port
          value: "{{ zimantic_port }}"
        - option: zimantic_source_dir
          value: "{{ zimantic_source_dir }}"
        - option: zimantic_data_dir
          value: "{{ zimantic_data_dir }}"
        - option: zimantic_zim_dir
          value: "{{ zimantic_zim_dir }}"
        - option: zimantic_index_dir
          value: "{{ zimantic_index_dir }}"
        - option: zimantic_file_types
          value: "{{ zimantic_file_types | join(',') }}"
        - option: zimantic_file_helpers
          value: "{{ zimantic_file_helpers }}"
        - option: zimantic_ocr
          value: "{{ zimantic_ocr }}"
        - option: zimantic_asr
          value: "{{ zimantic_asr }}"
        - option: zimantic_archive_depth
          value: "{{ zimantic_archive_depth }}"

  rescue:

    - name: Restart Zimantic after a failed reinstall
      systemd:
        name: zimantic
        state: started
      when:
        - reinstall
        - zimantic_active is defined and
          zimantic_active.rc is defined and
          zimantic_active.rc == 0

    - name: 'SEE ERROR ABOVE (skip_role_on_error: {{ skip_role_on_error }})'
      fail:
        msg: ""
      when: not skip_role_on_error
