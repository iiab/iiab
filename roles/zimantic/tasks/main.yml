---
# Entry point. This file only validates and dispatches to the lifecycle task
# files; see "Role task lifecycle" in the top-level README.md.
#
#   install.yml    offline-safe build/repair from the local checkout
#   update.yml     the only phase that fetches a new program version
#   configure.yml  runs when enabled; configuration, assets, and service settings
#   reinstall.yml  local preparation for --reinstall / --force-reinstall
#   uninstall.yml  cleanup for --uninstall
#   state.yml      records the reported settings in iiab.ini

# ./runrole --uninstall zimantic removes the role instead of applying it, so
# skip install-time validation and end the role once cleanup is done.
- name: Uninstall Zimantic
  include_tasks: uninstall.yml
  when: uninstall

- name: Stop processing Zimantic after uninstall
  meta: end_role
  when: uninstall

- name: Validate Zimantic settings
  import_tasks: validate.yml

- block:

    # reinstall.yml stops the service and removes the source or data that
    # --force-reinstall resets; update.yml, install.yml, and configure.yml
    # rebuild them.
    - name: Prepare an existing Zimantic install for reinstall
      include_tasks: reinstall.yml
      when: reinstall or force_reinstall

    - name: Inspect the Zimantic source checkout
      include_tasks: check-source.yml

    # update.yml fetches the requested version. It also runs when the checkout
    # is missing or does not match zimantic_version (for example after a
    # manual reset), because install.yml cannot rebuild the requested code
    # from a source tree that is not on disk.
    - name: Update Zimantic packages and source
      include_tasks: update.yml
      when: >-
        zimantic_needs_update | bool or
        not zimantic_source_git.stat.exists or
        not (zimantic_source_matches_version | bool)

    # Dependency resolution needs network access. A plain --reinstall and an
    # offline repair of the installed version must use --no-deps instead.
    - name: Install or repair Zimantic from the local checkout
      include_tasks: install.yml
      vars:
        zimantic_resolve_dependencies: >-
          {{ (zimantic_needs_update | bool) or
             (not zimantic_source_git.stat.exists) or
             (not (zimantic_source_matches_version | bool)) }}

    - name: Apply Zimantic configuration, assets, and service settings
      include_tasks: configure.yml

  when: zimantic_enabled

  rescue:

    - name: Report the rescued Zimantic failure
      debug:
        msg: >-
          {{ ansible_failed_task.name | default('Zimantic role failed') }}:
          {{ ansible_failed_result.msg | default(ansible_failed_result.stderr | default('unknown error')) }}

    - name: Restart Zimantic after a failed reinstall
      systemd:
        name: zimantic
        state: started
      when:
        - reinstall
        - zimantic_active is defined and
          zimantic_active.rc is defined and
          zimantic_active.rc == 0

    - name: 'SEE ERROR ABOVE (skip_role_on_error: {{ skip_role_on_error }})'
      fail:
        msg: ""
      when: not skip_role_on_error

- include_tasks: enable-or-disable.yml

- name: Record Zimantic state
  include_tasks: state.yml
