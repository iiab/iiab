---
# Always runs. Configuration, model files, and the service definition are
# reconciled on every apply, so local_vars.yml changes take effect without a
# reinstall. Fetching a missing model is allowed here because it is an
# immutable asset, not a program version; nothing is deleted or re-downloaded
# when the file and checksum already match.

- name: Create Linux user {{ zimantic_user }}
  user:
    name: "{{ zimantic_user }}"
    state: present
    shell: /usr/sbin/nologin
    system: yes
    create_home: no

- name: Create Zimantic directories
  file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(zimantic_user) }}"
    group: "{{ item.group | default(zimantic_user) }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - path: "{{ zimantic_source_dir }}"
      owner: root
      group: root
    - path: "{{ zimantic_data_dir }}"
    - path: "{{ zimantic_index_dir }}"
    - path: "{{ zimantic_model_dir }}"
    - path: "{{ zimantic_zim_dir }}"
      owner: root
      group: root

# Both tokenizers in one model directory would make Zimantic choose
# SentencePiece, which is wrong for the English model.
- name: Remove the tokenizer left by a different embedding model
  file:
    path: "{{ zimantic_model_dir }}/{{ zimantic_unused_tokenizer_file }}"
    state: absent
  notify: Restart Zimantic
  when: zimantic_mode == 'semantic'

- name: Download Zimantic embedding model
  get_curl:
    url: "{{ zimantic_selected_model_url }}"
    dest: "{{ zimantic_model_dir }}/model.onnx"
    checksum: "{{ zimantic_selected_model_checksum }}"
    timeout: "{{ download_timeout }}"
  notify: Restart Zimantic
  when: zimantic_mode == 'semantic'

- name: Download Zimantic tokenizer
  get_curl:
    url: "{{ zimantic_selected_tokenizer_url }}"
    dest: "{{ zimantic_model_dir }}/{{ zimantic_selected_tokenizer_file }}"
    checksum: "{{ zimantic_selected_tokenizer_checksum }}"
    timeout: "{{ download_timeout }}"
  notify: Restart Zimantic
  when: zimantic_mode == 'semantic'

- name: Check for the Zimantic embedding model
  stat:
    path: "{{ zimantic_model_dir }}/model.onnx"
  register: zimantic_model_file
  when: zimantic_mode == 'semantic'

- name: Check for the Zimantic tokenizer
  stat:
    path: "{{ zimantic_model_dir }}/{{ zimantic_selected_tokenizer_file }}"
  register: zimantic_tokenizer_file
  when: zimantic_mode == 'semantic'

- name: Fail if semantic mode has no embedding model
  fail:
    msg: "Semantic mode needs model.onnx and {{ zimantic_selected_tokenizer_file }} in {{ zimantic_model_dir }}; the download failed or the files were removed"
  when:
    - zimantic_mode == 'semantic'
    - not zimantic_model_file.stat.exists or
      not zimantic_tokenizer_file.stat.exists

- name: Install Zimantic configuration
  template:
    src: config.toml.j2
    dest: "{{ zimantic_config_file }}"
    owner: "{{ zimantic_user }}"
    group: "{{ zimantic_user }}"
    mode: "0644"
  notify: Restart Zimantic

- name: Install zimantic.service
  template:
    src: zimantic.service.j2
    dest: /etc/systemd/system/zimantic.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Zimantic
