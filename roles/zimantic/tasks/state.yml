---
# Record the reported settings after a successful apply. The installed marker
# itself is written by install.yml as soon as the build succeeds.

- name: Add 'zimantic' variable values to {{ iiab_ini_file }}
  ini_file:
    path: "{{ iiab_ini_file }}"
    section: zimantic
    option: "{{ item.option }}"
    value: "{{ item.value | string }}"
  with_items:
    - option: name
      value: Zimantic
    - option: description
      value: '"Meaning-based and full-text search for local Kiwix ZIM files."'
    - option: zimantic_install
      value: "{{ zimantic_install }}"
    - option: zimantic_enabled
      value: "{{ zimantic_enabled }}"
    - option: zimantic_mode
      value: "{{ zimantic_mode }}"
    - option: zimantic_embedding_model
      value: "{{ zimantic_embedding_model_selected }}"
    - option: zimantic_version
      value: "{{ zimantic_version }}"
    - option: zimantic_url
      value: "{{ zimantic_url }}"
    - option: zimantic_port
      value: "{{ zimantic_port }}"
    - option: zimantic_source_dir
      value: "{{ zimantic_source_dir }}"
    - option: zimantic_data_dir
      value: "{{ zimantic_data_dir }}"
    - option: zimantic_zim_dir
      value: "{{ zimantic_zim_dir }}"
    - option: zimantic_index_dir
      value: "{{ zimantic_index_dir }}"
