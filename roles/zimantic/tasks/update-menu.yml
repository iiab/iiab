# The Admin Console owns the Home Page menu. Run this after iiab.ini has been
# updated so enabled and disabled role state is reflected in the menu.
- name: Check for the Admin Console Home Page menu updater
  stat:
    path: /usr/bin/iiab-update-menus
  register: zimantic_menu_updater

- name: Reconcile Zimantic in the Home Page menu
  command: /usr/bin/iiab-update-menus
  when:
    - not ansible_check_mode
    - zimantic_menu_updater.stat.exists
  changed_when: false
