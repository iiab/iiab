---
- name: Enable and start zimantic.service
  systemd:
    name: zimantic
    enabled: yes
    state: started
    daemon_reload: yes
  when: zimantic_enabled

# The marker comes from iiab_state.yml, so only a service this role installed
# is touched. On a first apply that installs with _enabled False the marker is
# still undefined for the rest of this run; the new unit is not enabled or
# started by default, so there is nothing to stop.
- name: Disable and stop zimantic.service
  systemd:
    name: zimantic
    enabled: no
    state: stopped
  when:
    - not zimantic_enabled
    - zimantic_installed is defined

- name: Disable http://box{{ zimantic_url }} shortcut via NGINX
  file:
    path: "{{ nginx_conf_dir }}/zimantic-nginx.conf"
    state: absent
  notify:
    - Restart nginx
    - Restart nginx via pdsm
  when: not zimantic_enabled

- name: Enable http://box{{ zimantic_url }} shortcut via NGINX
  template:
    src: zimantic-nginx.conf.j2
    dest: "{{ nginx_conf_dir }}/zimantic-nginx.conf"
  notify:
    - Restart nginx
    - Restart nginx via pdsm
  when: zimantic_enabled
