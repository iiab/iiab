---
- name: Enable and start zimantic.service
  systemd:
    name: zimantic
    enabled: yes
    state: started
    daemon_reload: yes
  when: zimantic_enabled

- name: Check whether zimantic.service is installed
  stat:
    path: /etc/systemd/system/zimantic.service
  register: zimantic_unit

- name: Disable and stop zimantic.service
  systemd:
    name: zimantic
    enabled: no
    state: stopped
  when:
    - not zimantic_enabled
    - zimantic_unit.stat.exists

- name: Disable http://box{{ zimantic_url }} shortcut via NGINX
  file:
    path: "{{ nginx_conf_dir }}/zimantic-nginx.conf"
    state: absent
  notify:
    - Restart nginx
    - Restart nginx via pdsm
  when: not zimantic_enabled

- name: Enable http://box{{ zimantic_url }} shortcut via NGINX
  template:
    src: zimantic-nginx.conf.j2
    dest: "{{ nginx_conf_dir }}/zimantic-nginx.conf"
  notify:
    - Restart nginx
    - Restart nginx via pdsm
  when: zimantic_enabled
