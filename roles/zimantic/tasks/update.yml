---
# Network phase. Fetches the requested program version and installs missing
# system packages. install.yml includes it when the source checkout is missing
# or does not match zimantic_version (on a first install, after --reinstall, or
# for --upgrade). It never removes runtime data or user settings.
# check-source.yml has already computed zimantic_source_matches_version.

# Checking first keeps offline reruns from touching the network: apt would
# otherwise run 'apt-get update' on every run, even when nothing is missing.
- name: Check which Zimantic system packages are missing
  command: "dpkg-query -W -f='${db:Status-Status}' {{ item }}"
  register: zimantic_system_package_status
  changed_when: false
  failed_when: false
  check_mode: no
  loop: "{{ zimantic_system_packages }}"
  when: zimantic_system_packages_enabled | bool

- name: Install native dependencies from the distribution
  apt:
    name: "{{ zimantic_system_packages }}"
    state: present
    update_cache: yes
    cache_valid_time: 3600
  when:
    - zimantic_system_packages_enabled | bool
    - zimantic_system_package_status.results | default([]) |
      rejectattr('stdout', 'equalto', 'installed') | list | length > 0

- name: Reconcile the Zimantic source checkout
  block:

    # A previous interrupted fetch can leave a commit object without its tree.
    # The git module then cannot repair the checkout, so reclone the disposable
    # source directory before it attempts the requested revision.
    - name: Check the current Zimantic source tree
      command:
        cmd: "git -C {{ zimantic_source_dir }} cat-file -e HEAD^{tree}"
      register: zimantic_source_tree
      changed_when: false
      failed_when: false
      check_mode: no
      when: zimantic_source_git.stat.exists | bool

    - name: Check the requested Zimantic commit object
      command:
        cmd: "git -C {{ zimantic_source_dir }} cat-file -e {{ zimantic_checkout_version }}^{commit}"
      register: zimantic_requested_commit
      changed_when: false
      failed_when: false
      check_mode: no
      when: zimantic_source_git.stat.exists | bool

    - name: Check the requested Zimantic source tree
      command:
        cmd: "git -C {{ zimantic_source_dir }} cat-file -e {{ zimantic_checkout_version }}^{tree}"
      register: zimantic_requested_tree
      changed_when: false
      failed_when: false
      check_mode: no
      when: zimantic_source_git.stat.exists | bool

    - name: Remove incomplete Zimantic source checkout
      file:
        path: "{{ zimantic_source_dir }}"
        state: absent
      register: zimantic_source_checkout_removed
      when:
        - zimantic_source_git.stat.exists | bool
        - >-
          (zimantic_source_tree.rc != 0) or
          (zimantic_requested_commit.rc == 0 and
           zimantic_requested_tree.rc != 0)

    # The source directory is documented as disposable: discard local tracked
    # changes before deciding whether a fetch is necessary. 'git: update: no'
    # returns before resetting anything, so this cannot be left to the module.
    - name: Discard local changes in the matching Zimantic source
      command: "git -C {{ zimantic_source_dir }} reset --hard HEAD"
      changed_when: false
      when:
        - zimantic_source_matches_version | bool
        - not (zimantic_source_checkout_removed.changed | default(false) | bool)

    # The checkout can still fail when the repository is damaged in a way the
    # preflight checks above do not cover, for example when a fetch leaves the
    # requested commit missing even though the source directory looks healthy.
    # The source directory is disposable, so replace it and try once more.
    - name: Check out Zimantic {{ zimantic_checkout_version }}, repairing the source if needed
      block:

        - name: Check out Zimantic {{ zimantic_checkout_version }}
          git:
            repo: "{{ zimantic_repo }}"
            dest: "{{ zimantic_source_dir }}"
            version: "{{ zimantic_checkout_version }}"
            # An older single-branch clone only fetches its own branch, so a
            # commit hash on another branch stays missing. Fetch every branch.
            refspec: "+refs/heads/*:refs/remotes/origin/*"
            update: "{{ not (zimantic_source_matches_version | bool) }}"
            force: yes

      rescue:

        - name: Remove unusable Zimantic source checkout
          file:
            path: "{{ zimantic_source_dir }}"
            state: absent

        - name: Clone Zimantic {{ zimantic_checkout_version }} into a fresh checkout
          git:
            repo: "{{ zimantic_repo }}"
            dest: "{{ zimantic_source_dir }}"
            version: "{{ zimantic_checkout_version }}"
            # The directory was removed, so Ansible clones regardless of update.
            update: yes
            force: yes
