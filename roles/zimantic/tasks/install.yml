---
# Offline-safe build phase. Runs on every apply, but does nothing when the
# installed executable is already usable. It never fetches a new version and
# never removes runtime data; update.yml owns network refreshes.
#
# A plain --reinstall and a repair of the installed version rebuild with
# --no-deps from the local checkout. Resolving dependencies only happens after
# update.yml, or when the checkout had to be created from scratch.

- name: Check for the Zimantic source checkout
  stat:
    path: "{{ zimantic_source_dir }}/.git"
  register: zimantic_install_source

- name: Fail if the Zimantic source checkout is missing
  fail:
    msg: >-
      {{ zimantic_source_dir }} is missing. Run './runrole --upgrade zimantic'
      while online, or restore the checkout before retrying.
  when: not zimantic_install_source.stat.exists

- name: Create Zimantic Python virtual environment
  command:
    cmd: "{{ zimantic_python }} -m venv {{ '--system-site-packages ' if (zimantic_system_packages_enabled | bool) else '' }}{{ zimantic_venv }}"
    creates: "{{ zimantic_venv }}/bin/python"

- name: Check for the Zimantic virtual environment
  stat:
    path: "{{ zimantic_venv }}/bin/python"
  register: zimantic_venv_python

- name: Check for the Zimantic executable
  stat:
    path: "{{ zimantic_venv }}/bin/zimantic"
  register: zimantic_executable

- name: Rebuild Zimantic from the local checkout
  when: zimantic_rebuild | bool
  vars:
    zimantic_rebuild: >-
      {{ (not zimantic_executable.stat.exists) or
         (zimantic_needs_update | bool) or
         reinstall }}
  block:

    # pip's default build isolation creates a temporary environment and
    # downloads setuptools, which fails offline. Keep setuptools in the venv so
    # the project can be rebuilt from the local checkout.
    - name: Check for setuptools in the Zimantic virtual environment
      command: "{{ zimantic_venv }}/bin/python -c 'import setuptools'"
      register: zimantic_setuptools
      changed_when: false
      failed_when: false

    - name: Install setuptools for build-isolation-free installs
      command:
        cmd: "{{ zimantic_venv }}/bin/python -m pip install --disable-pip-version-check setuptools"
      register: zimantic_setuptools_install
      failed_when: false
      when: zimantic_setuptools.rc != 0

    # The build needs setuptools, so a failed install means there is no usable
    # offline path. Surface the pip error instead of failing later inside pip's
    # build step.
    - name: Fail if setuptools is unavailable or cannot be installed
      fail:
        msg: >-
          setuptools is required to build Zimantic but is missing from
          {{ zimantic_venv }} and could not be installed. If this host is
          offline, install setuptools while online and rerun.
          {{ zimantic_setuptools_install.stderr | default('') }}
      when:
        - zimantic_setuptools.rc != 0
        - zimantic_setuptools_install.rc != 0

    - name: Record (initial) disk space used
      shell: df -B1 --output=used / | tail -1
      register: zimantic_df1
      changed_when: false

    # When system packages provide the native dependencies, pip must not fetch
    # or replace them. --no-deps is also what makes a plain --reinstall and an
    # offline repair work. A newly created virtual environment has no
    # dependencies yet, so it must resolve them even on a reinstall.
    - name: Install Zimantic and runtime dependencies
      command:
        cmd: "{{ zimantic_venv }}/bin/python -m pip install --disable-pip-version-check --no-cache-dir --no-build-isolation --upgrade --force-reinstall {{ '' if (zimantic_resolve_dependencies | bool or not zimantic_venv_python.stat.exists) else '--no-deps ' }}{{ zimantic_source_dir }}"
      register: zimantic_pip_install
      changed_when: "'Successfully installed' in zimantic_pip_install.stdout"
      notify: Restart Zimantic

    - name: Record (final) disk space used
      shell: df -B1 --output=used / | tail -1
      register: zimantic_df2
      changed_when: false

    - name: Add 'zimantic_disk_usage' to {{ iiab_ini_file }}
      ini_file:
        path: "{{ iiab_ini_file }}"
        section: zimantic
        option: zimantic_disk_usage
        value: "{{ zimantic_df2.stdout | int - zimantic_df1.stdout | int }}"

    # Record the installed marker as soon as the build succeeds, so a later
    # configure failure does not force another dependency resolution on an
    # offline host.
    - name: "Set 'zimantic_installed: True' in {{ iiab_state_file }}"
      lineinfile:
        path: "{{ iiab_state_file }}"
        regexp: '^zimantic_installed'
        line: 'zimantic_installed: True'
      when: iiab_state_file is file

    - name: "Set 'zimantic_installed_version: {{ zimantic_version }}' in {{ iiab_state_file }}"
      lineinfile:
        path: "{{ iiab_state_file }}"
        regexp: '^zimantic_installed_version:'
        line: "zimantic_installed_version: {{ zimantic_version }}"
      when: iiab_state_file is file
