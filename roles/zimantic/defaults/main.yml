# zimantic_install: False
# zimantic_enabled: False

# Zimantic's fast mode provides title-word and native ZIM full-text search
# without loading the embedding model. Use "semantic" only on supported,
# 64-bit systems with enough memory.
zimantic_mode: fast
zimantic_port: 8090
zimantic_url_without_slash: /zimantic
zimantic_url: "{{ zimantic_url_without_slash }}/"

# Zimantic currently supports Python 3.11-3.14; libzim and other native
# dependencies publish wheels only for selected Python versions and
# architectures.
zimantic_python: python3
zimantic_architectures:
  - aarch64
  - x86_64

zimantic_repo: https://github.com/chapmanjacobd/zimantic.git
zimantic_version: v0.1.3
zimantic_source_dir: "{{ iiab_base }}/zimantic"
zimantic_venv: "{{ zimantic_source_dir }}/.venv"
zimantic_user: zimantic

zimantic_data_dir: "{{ content_base }}/zimantic"
zimantic_zim_dir: "{{ iiab_zim_path }}/content"
zimantic_index_dir: "{{ zimantic_data_dir }}/indexes"
zimantic_model_dir: "{{ zimantic_data_dir }}/model"
zimantic_config_file: "{{ zimantic_data_dir }}/config.toml"

# Do not download the approximately 123 MB model unless semantic mode is
# explicitly selected and this switch is enabled.
zimantic_download_model: False
zimantic_model_url: https://huggingface.co/Xenova/multilingual-e5-small/resolve/main/onnx/model_quantized.onnx
zimantic_model_checksum: sha256:f80102d3f2a1229f387d3c81909990d8945513e347b0eab049f7de3c6f98c193
zimantic_tokenizer_url: https://huggingface.co/intfloat/multilingual-e5-small/resolve/main/sentencepiece.bpe.model
zimantic_tokenizer_checksum: sha256:cfc8146abe2a0488e9e2a0c56de7952f7c11ab059eca145a0a727afce0db2865

# The fast server benchmark uses about 66 MiB RSS. Semantic mode needs a
# larger cgroup budget for the model and tokenizer.
zimantic_memory_max: "{{ '450M' if zimantic_mode == 'semantic' else '256M' }}"
zimantic_oom_score_adjust: 200
