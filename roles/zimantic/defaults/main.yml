# zimantic_install: False
# zimantic_enabled: False

# Zimantic's fast mode provides title-word and native ZIM full-text search
# without loading the embedding model. Semantic mode adds meaning-based search
# but loads an embedding model and needs more memory.
zimantic_mode: fast
zimantic_port: 8090
zimantic_url_without_slash: /zimantic
zimantic_url: "{{ zimantic_url_without_slash }}/"

# File types that "zimantic build" indexes when it scans a folder. By default,
# only ZIMs are indexed. Add extensions or named profiles to make ordinary
# files searchable alongside the ZIMs:
#
#   zimantic_file_types: [zim, text, ebook]     # text, Markdown, PDF, EPUB, ...
#   zimantic_file_types: [zim, docs, media]     # Office, subtitles, video, ...
#   zimantic_file_types: [zim, all]             # every supported file type
#   zimantic_file_types: [zim, all+unknown]     # every file; sniff its contents
#
# Named profiles are text, ebook, docs, office, media, video, audio, image,
# comic, archive, all, and all+unknown. Extensions may be written as "epub",
# ".epub" or "*.epub". Explicit paths passed to "zimantic build" are always
# indexed.
zimantic_file_types:
  - zim

# Limits for ordinary-file extraction. They apply only when zimantic_file_types
# includes a non-ZIM type. A per-file deadline keeps one malformed file from
# blocking a build, while the text-length and archive limits bound memory use.
zimantic_file_timeout: 120
zimantic_max_file_text_chars: 2000000
zimantic_archive_depth: 0
zimantic_max_archive_members: 10000
zimantic_max_archive_bytes: 268435456
zimantic_max_ocr_pages: 50

# OCR and speech recognition are opt-in because they are slow and need extra
# tools (Tesseract and Whisper). OCR languages use Tesseract's language codes.
zimantic_ocr: False
zimantic_ocr_languages: eng
zimantic_asr: False
zimantic_asr_model: tiny

# Optional command-line extractors improve ordinary-file support. "auto"
# installs the packages below when zimantic_file_types includes non-ZIM files;
# "always" installs them even when only ZIMs are indexed; "never" leaves
# installation of optional tools to the administrator.
zimantic_file_helpers: auto
zimantic_file_helper_packages:
  - poppler-utils     # pdftotext
  - unrtf             # unrtf
  - catdoc            # catdoc, catppt, xls2csv (legacy Office)
  - ghostscript       # ps2ascii (PostScript/EPS)
  - libchm-bin        # extract_chm
  - unar              # RAR and other archives
  - ffmpeg            # ffmpeg, ffprobe (embedded or sidecar subtitles)
# OCR needs Tesseract. The base tesseract-ocr package usually includes English;
# add Debian language packs (for example tesseract-ocr-fra) to
# zimantic_ocr_packages for other languages. They are installed only when
# zimantic_ocr is enabled.
zimantic_ocr_packages:
  - tesseract-ocr

# Zimantic currently supports Python 3.11-3.14. libzim and other native
# dependencies publish wheels only for selected Python versions and
# architectures; by default, armhf uses distribution packages instead.
zimantic_python: python3

# Native dependencies for architectures without PyPI wheels. Debian 13/trixie
# and newer provide these for armhf. They are installed system-wide and the
# virtual environment is created with --system-site-packages, so on these hosts
# keep zimantic_python pointed at the distribution interpreter.
zimantic_system_packages:
  - python3-numpy
  - python3-tqdm
  - python3-onnxruntime
  - python3-sentencepiece
  - python3-faiss
  - python3-libzim
  - python3-pymupdf
  - python3-chardet
  - python3-fastapi
  - python3-uvicorn
  # Needed to rebuild the local project without pip's network-fetching build
  - python3-setuptools
# "auto" uses distribution packages only where PyPI wheels are unavailable
# (32-bit arm); "always" uses them on every architecture; "never" always
# installs the native dependencies from PyPI wheels.
zimantic_use_system_packages: auto

zimantic_repo: https://github.com/chapmanjacobd/zimantic.git
zimantic_version: v0.1.6
zimantic_source_dir: "{{ iiab_base }}/zimantic"
zimantic_venv: "{{ zimantic_source_dir }}/.venv"
zimantic_user: zimantic

zimantic_data_dir: "{{ content_base }}/zimantic"
zimantic_zim_dir: "{{ iiab_zim_path }}/content"
zimantic_index_dir: "{{ zimantic_data_dir }}/indexes"
zimantic_model_dir: "{{ zimantic_data_dir }}/model"
zimantic_config_file: "{{ zimantic_data_dir }}/config.toml"

# "auto" uses e5-small-v2 on hosts with 1 GB RAM or less and
# multilingual-e5-small otherwise. Set a model name to force a choice.
zimantic_embedding_model: auto

# multilingual-e5-small: 100+ languages, approximately 123 MB.
zimantic_multilingual_model_url: https://huggingface.co/Xenova/multilingual-e5-small/resolve/main/onnx/model_quantized.onnx
zimantic_multilingual_model_checksum: sha256:f80102d3f2a1229f387d3c81909990d8945513e347b0eab049f7de3c6f98c193
zimantic_multilingual_tokenizer_file: sentencepiece.bpe.model
zimantic_multilingual_tokenizer_url: https://huggingface.co/intfloat/multilingual-e5-small/resolve/main/sentencepiece.bpe.model
zimantic_multilingual_tokenizer_checksum: sha256:cfc8146abe2a0488e9e2a0c56de7952f7c11ab059eca145a0a727afce0db2865

# e5-small-v2: English only, approximately 34 MB.
zimantic_english_model_url: https://huggingface.co/Xenova/e5-small-v2/resolve/main/onnx/model_quantized.onnx
zimantic_english_model_checksum: sha256:7d9092cb25f2bd1c023b7e8d2aa459044a02030ac880e5a59fdaf27af69f1ded
zimantic_english_tokenizer_file: vocab.txt
zimantic_english_tokenizer_url: https://huggingface.co/Xenova/e5-small-v2/resolve/main/vocab.txt
zimantic_english_tokenizer_checksum: sha256:07eced375cec144d27c900241f3e339478dec958f92fddbc551f295c992038a3

# Memory limits for the systemd cgroup. MemoryHigh makes the kernel reclaim and
# throttle under pressure; MemoryMax is the hard limit that OOM-kills only
# Zimantic, not the rest of the device. Keep MemoryHigh below MemoryMax.
# On a 512 MB host, 80% leaves roughly 100 MB for the kernel, NGINX, Kiwix and
# SSH. Lower both percentages (or point zimantic_zim_dir at fewer ZIMs) if other
# services are starved. Override with fixed limits if needed, for example:
zimantic_memory_high: "70%"
zimantic_memory_max: "80%"
# zimantic_memory_high: "768M"
# zimantic_memory_max: "1G"

# OOMScoreAdjust only breaks ties when the whole device is out of memory; it
# does not cap Zimantic's memory. The cgroup limits above do that.
zimantic_oom_score_adjust: 200

# If Zimantic is OOM-killed, systemd retries after RestartSec. It stops
# restarting after StartLimitBurst starts in StartLimitIntervalSec, leaving the
# unit failed instead of looping through another OOM.
zimantic_restart_sec: 10
zimantic_start_limit_interval: 600
zimantic_start_limit_burst: 3
