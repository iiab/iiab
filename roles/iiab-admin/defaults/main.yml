# Please read more about the 'iiab-admin' Linux user, for login to IIAB's
# Admin Console (http://box.lan/admin) AND to help you at the command-line:
# https://github.com/iiab/iiab/tree/master/roles/iiab-admin
# https://github.com/iiab/iiab-admin-console/blob/master/Authentication.md

# By default the administrator is the account that ran 'sudo iiab' (SUDO_USER),
# falling back to the current user.  Set iiab_admin_user explicitly to manage a
# different account:
# iiab_admin_user: iiab-admin

# Set iiab_admin_user_install: False if you don't want iiab_admin_user auto-
# configured e.g. by IIAB's 1-line installer & iiab-admin/tasks/admin-user.yml
# iiab_admin_user_install: True

# IIAB never sets or generates this account's password.  The account and
# password are expected to exist before IIAB runs (OS installer, Raspberry Pi
# Imager, cloud-init, or an explicit 'passwd').  A missing account is created
# locked so the operator must set a password before logging in.

# Full sudo is opt-in.  These scoped rules cover IIAB's own support commands.
iiab_admin_can_sudo: False
iiab_admin_support_sudo: True
iiab_admin_revoke_sudo: False

# Fallback for standalone role runs.  IIAB playbooks load the real value from
# vars/default_vars.yml; it is only used to warn upgraded installs.
iiab_admin_legacy_pwd: g0adm1n

# Commands installed in /usr/bin and /usr/local/bin that an Admin Console
# operator may run through sudo.  Keep this list narrow: a command that can
# run arbitrary Ansible playbooks or open a shell belongs in the sudo group,
# not here.
#
# iiab-network runs the network playbook, so it is privileged by nature.  It
# stays here because it is a documented support command; remove it if your
# threat model does not trust Admin Console operators.
iiab_admin_support_commands:
  - /usr/bin/iiab-check-firmware
  - /usr/bin/iiab-diagnostics
  - /usr/bin/iiab-hotspot-off
  - /usr/bin/iiab-hotspot-on
  - /usr/bin/iiab-internet-off
  - /usr/bin/iiab-internet-on
  - /usr/bin/iiab-summary
  - /usr/local/bin/iiab-network

# All above are set in: github.com/iiab/iiab/blob/master/vars/default_vars.yml
# If nec, change them by editing /etc/iiab/local_vars.yml prior to installing!
