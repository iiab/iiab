# Scoped sudo for IIAB's own support commands.  This replaces the old default
# of adding the admin user to the sudo group, which gave that account general
# root access merely to make a handful of /usr/bin/iiab-* commands convenient.

- name: Make sure /etc/sudoers.d exists
  file:
    path: /etc/sudoers.d
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: Install scoped sudo rules for IIAB support commands
  template:
    src: iiab-support.sudoers.j2
    dest: /etc/sudoers.d/iiab-support
    owner: root
    group: root
    mode: '0440'
    validate: visudo -cf %s
  when: iiab_admin_support_sudo | bool

- name: Remove scoped sudo rules for IIAB support commands
  file:
    path: /etc/sudoers.d/iiab-support
    state: absent
  when: not (iiab_admin_support_sudo | bool)
