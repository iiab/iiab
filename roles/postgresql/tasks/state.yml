---
# Record the reported settings after a successful apply.

- name: Add 'postgresql' variable values to {{ iiab_ini_file }}
  ini_file:
    path: "{{ iiab_ini_file }}"    # /etc/iiab/iiab.ini
    section: postgresql
    option: "{{ item.option }}"
    value: "{{ item.value | string }}"
  with_items:
    - option: name
      value: PostgreSQL
    - option: description
      value: '"PostgreSQL is a powerful, open source object-relational database system."'
    - option: postgresql_install
      value: "{{ postgresql_install }}"
    - option: postgresql_enabled
      value: "{{ postgresql_enabled }}"

- name: "Add 'postgresql_installed: True' to {{ iiab_state_file }}"
  iiab_state:
    key: postgresql_installed
