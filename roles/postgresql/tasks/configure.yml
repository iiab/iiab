---
# Reconcile PostgreSQL's IIAB unit file and server configuration on every
# apply.  Packages and the initial database are created by install.yml (first
# install, --reinstall and --clean-install only).

- name: Install /etc/systemd/system/postgresql-iiab.service from template (0644 by default)
  template:
    src: postgresql-iiab.service.j2
    dest: /etc/systemd/system/postgresql-iiab.service

- name: Install /library/pgsql-iiab/postgresql.conf from template (postgres:postgres, 0640)
  template:
    src: postgresql.conf.j2
    dest: /library/pgsql-iiab/postgresql.conf
    owner: postgres
    group: postgres
    mode: "0640"
