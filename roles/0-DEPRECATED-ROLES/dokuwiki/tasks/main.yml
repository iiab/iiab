- name: Install DokuWiki
  include_tasks: install.yml
  when: dokuwiki_install and not lookup('installed', 'dokuwiki_installed') or reinstall

- name: Enable DokuWiki
  include_tasks: enable.yml
  when: dokuwiki_install or lookup('installed', 'dokuwiki_installed')

- name: "Add 'dokuwiki_installed: True' to {{ iiab_state_file }}"
  iiab_state:
    key: dokuwiki_installed
  when: dokuwiki_install or lookup('installed', 'dokuwiki_installed')
