---
- hosts: all
  become: yes

  vars_files:
    - vars/default_vars.yml
    # ansible-core 2.19 disallows (thankfully no longer needed!)
    #- vars/{{ ansible_local.local_facts.os_ver }}.yml
    - /etc/iiab/local_vars.yml
    - /etc/iiab/iiab_state.yml

  roles:
    - { role: 0-init }
    - { role: 4-server-options }
    - { role: 5-xo-services }
    - { role: 6-generic-apps }
    - { role: 7-edu-apps }
    - { role: 8-mgmt-tools }
    - { role: 9-local-addons }
    - { role: network }

  post_tasks:
    - name: "Remove /usr/sbin/policy-rc.d (reinstated at the start of each playbook by 0-init, so later manual 'apt install' behaves normally)"
      file:
        path: /usr/sbin/policy-rc.d
        state: absent
