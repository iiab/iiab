name: 'Ansible modules/ + action_plugins/ Integration Tests'

on:
  push:
    paths:
      - 'modules/**'
      - 'action_plugins/**'
  pull_request:
    paths:
      - 'modules/**'
      - 'action_plugins/**'
  workflow_dispatch:

jobs:
  ansible:
    runs-on: ubuntu-slim
    steps:
      - run: echo "🎉 Triggered by a ${{ github.event_name }} event"
      - run: 'echo "🔎 Branch: ${{ github.ref }}"'

      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Install ansible-core
        run: python -m pip install --upgrade pip ansible-core

      - name: Run Ansible integration tests
        run: |
          ANSIBLE_LIBRARY=modules ansible-playbook -i localhost, modules/tests/get_curl.yml
          ANSIBLE_ACTION_PLUGINS=action_plugins ansible-playbook -i localhost, action_plugins/tests/pip_retry.yml
