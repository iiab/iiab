name: 'Ansible modules/ Integration Tests'

on:
  push:
    paths:
      - 'modules/**'
      - 'scripts/**'
      - 'lookup_plugins/**'
      - 'runrole'
      - 'runrole-base.yml'
      - 'runroles'
  pull_request:
    paths:
      - 'modules/**'
      - 'scripts/**'
      - 'lookup_plugins/**'
      - 'runrole'
      - 'runrole-base.yml'
      - 'runroles'
  workflow_dispatch:

jobs:
  ansible:
    runs-on: ubuntu-slim
    steps:
      - run: echo "🎉 Triggered by a ${{ github.event_name }} event"
      - run: 'echo "🔎 Branch: ${{ github.ref }}"'

      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Install ansible-core
        run: python -m pip install --upgrade pip ansible-core

      - name: Run Ansible integration tests
        run: ANSIBLE_LIBRARY=modules ansible-playbook -i localhost, modules/tests/get_curl.yml

      - name: Run iiab_state integration tests
        run: ANSIBLE_LIBRARY=modules ansible-playbook -i localhost, modules/tests/iiab_state.yml

      - name: Run disk_usage integration tests
        run: ANSIBLE_LIBRARY=modules ansible-playbook -i localhost, modules/tests/disk_usage.yml

      - name: Run the awstats lifecycle test
        run: python scripts/test-role-lifecycle.py awstats --strict

      - name: Run the maps lifecycle test
        run: python scripts/test-role-lifecycle.py maps

  lint:
    runs-on: ubuntu-slim
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      # scripts/iiab-state has a Python shebang, so shellcheck cannot parse it;
      # it is covered by the py_compile step below instead.
      - name: Lint shell scripts
        run: shellcheck runrole runroles scripts/runrole-common.sh

      - name: Check Python syntax
        run: >-
          python3 -m py_compile
          scripts/iiab-state
          scripts/iiab_state_lib.py
          scripts/role_lifecycle.py
          scripts/test-role-lifecycle.py
          lookup_plugins/installed.py
          lookup_plugins/role_var.py
          modules/iiab_state.py
          modules/disk_usage.py
