name: '"05 min" Privilege Check'

on:
  push:
  pull_request:  # needed to show up in Pull Request UI
  workflow_dispatch:

jobs:
  privilege-check:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Check for new privileged patterns
        run: ./scripts/iiab-privilege-check --github
