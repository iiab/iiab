# Future overrides of /etc/ansible/ansible.cfg belong in this file.
# Also used by https://github.com/iiab/iiab-admin-console

#[defaults]
# Disallowed by Ansible 2.11+ -- see https://docs.ansible.com/ansible/devel/porting_guides/porting_guide_2.7.html#using-a-loop-on-a-package-module-via-squash-actions
#squash_actions = apk, apt, dnf, homebrew, openbsd_pkg, pacman, pkgng, yum, zypper, package
[defaults]
interpreter_python=/usr/local/ansible/bin/python3
library = ./modules
lookup_plugins = ./lookup_plugins
inject_facts_as_vars = False

# Keep routine runs quiet: unchanged ("ok") and skipped results are hidden, so
# TASK banners appear only for tasks that change or fail.  Changed and failed
# tasks still print normally.  To see everything for one run, export
# ANSIBLE_DISPLAY_OK_HOSTS=True and ANSIBLE_DISPLAY_SKIPPED_HOSTS=True
# ('sudo -E ./runrole ...' keeps them).  Setting either value to True here also
# restores the old behavior.
display_ok_hosts = False
display_skipped_hosts = False
