---
- name: Create a directory destination
  file:
    path: "{{ test_dir }}/directory"
    state: directory
    mode: "0755"

- name: Download into a directory destination
  get_curl:
    url: "{{ source_url }}"
    dest: "{{ test_dir }}/directory/"
    tmp_dest: "{{ tmp_dir }}"
  register: directory_result

- name: Assert that a directory destination is supported
  assert:
    that:
      - directory_result.changed

- name: Read the file downloaded into the directory
  slurp:
    src: "{{ test_dir }}/directory/source.txt"
  register: directory_content

- name: Assert that the directory download is correct
  assert:
    that:
      - directory_content.content | b64decode == "source content\n"

- name: Check that check mode does not create a destination directory
  get_curl:
    url: "{{ source_url }}"
    dest: "{{ test_dir }}/check-mode-dir/"
    tmp_dest: "{{ tmp_dir }}"
  check_mode: true
  register: check_mode_directory_result

- name: Stat the check-mode destination directory
  stat:
    path: "{{ test_dir }}/check-mode-dir"
  register: check_mode_directory_stat

- name: Assert that check mode does not create the directory
  assert:
    that:
      - check_mode_directory_result.changed
      - not check_mode_directory_stat.stat.exists
