---
- hosts: all
  become: yes

  module_defaults:
    ansible.builtin.package:
      update_cache: yes
      cache_valid_time: 3600
    ansible.builtin.apt:
      update_cache: yes
      cache_valid_time: 3600

  vars_files:
    - vars/default_vars.yml
    # ansible-core 2.19 disallows (thankfully not needed!)
    #- vars/{{ ansible_local.local_facts.os_ver }}.yml
    - /etc/iiab/local_vars.yml

  roles:
    - { role: 0-init }
