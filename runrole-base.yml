---
# Base playbook for ./runrole. ./runrole appends the requested roles to a
# temporary copy, so one base serves both single-role and multi-role runs.
- hosts: all
  become: yes
  gather_facts: false

  vars:
    default_vars_file: "{{ lookup('env', 'DEFAULT_VARS_FILE') or 'vars/default_vars.yml' }}"
    local_vars_file: "{{ lookup('env', 'LOCAL_VARS_FILE') or '/etc/iiab/local_vars.yml' }}"
    state_file: "{{ lookup('env', 'IIAB_STATE_FILE') or '/etc/iiab/iiab_state.yml' }}"

  vars_files:
    - "{{ default_vars_file }}"
    # ansible-core 2.19 disallows (thankfully not needed!)
    #- vars/{{ ansible_local.local_facts.os_ver }}.yml
    - "{{ local_vars_file }}"
    - "{{ state_file }}"

  module_defaults:
    iiab_state:
      path: "{{ iiab_state_file }}"

  pre_tasks:
    - name: Gather facts -- when not is_proot (not Android)
      setup:
      when: not is_proot

    - name: Gather minimal facts -- when is_proot (Android)
      setup:
        gather_subset:
          - 'all'
          - '!hardware'
          - '!network'
      when: is_proot

    - name: Compute memory and swap facts when hardware subset is missing
      when: is_proot
      block:
        - name: Read memtotal and swaptotal from /proc/meminfo
          shell: |
            awk '
              /MemTotal:/ {mem=int($2/1024)}
              /SwapTotal:/ {swap=int($2/1024)}
              END {
                if (swap == "") swap = 0
                print mem, swap
              }
            ' /proc/meminfo
          register: memswap
          changed_when: false

        - name: Set fallback memtotal and swaptotal facts
          set_fact:
            iiab_memtotal_mb: "{{ memswap.stdout.split()[0] | int }}"
            iiab_swaptotal_mb: "{{ memswap.stdout.split()[1] | int }}"

  roles:
    - { role: 0-init }
